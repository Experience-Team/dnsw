<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DNSW Wireframes</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .launch {
      text-align: center;
      max-width: 28rem;
    }
    .launch h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: .5rem; }
    .launch p  { color: #888; font-size: .9375rem; margin-bottom: 2rem; }
    .launch ul { list-style: none; display: flex; flex-direction: column; gap: .75rem; }
    .launch ul li a {
      display: block;
      padding: .75rem 1.25rem;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      text-decoration: none;
      color: #111;
      font-size: .9375rem;
      transition: box-shadow .15s;
    }
    .launch ul li a:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .launch ul li a.disabled { color: #bbb; pointer-events: none; }
    .launch ul li a span { float: right; font-size: .75rem; color: #bbb; margin-top: .1rem; }
  </style>
</head>
<body>
  <div class="launch">
    <h1>DNSW Wireframes</h1>
    <p>Select a page to open. Pages not yet built are shown but inactive.</p>
    <ul>
      <li><a href="pages/home.html">Homepage <span>Sydney / NSW</span></a></li>
      <!-- Add new pages below. Use class="disabled" for unbuilt pages. -->
      <li><a class="disabled">Destination page <span>Coming soon</span></a></li>
      <li><a class="disabled">Things to do <span>Coming soon</span></a></li>
      <li><a class="disabled">Itineraries <span>Coming soon</span></a></li>
    </ul>
  </div>
</body>
</html>
