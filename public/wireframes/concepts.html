<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RWC prototypes</title>
<!-- The concepts now live one per page: prototype-pick-your-team.html and prototype-itinerary.html. This forwards old
     links, keeping any ?reset, and sends the old #itinerary-list anchor to the itinerary page. -->
<script>
  (function () {
    var to = /^#itinerary/.test(location.hash) ? 'prototype-itinerary.html' : 'prototype-pick-your-team.html';
    location.replace(to + location.search);
  })();
</script>
<meta http-equiv="refresh" content="0; url=prototype-pick-your-team.html" />
<link rel="stylesheet" href="shared.css" />
</head>
<body class="cp-page">
  <p style="padding:2rem">The prototypes have moved: <a href="prototype-pick-your-team.html">Pick your team</a> and <a href="prototype-itinerary.html">Share/edit itinerary</a>.</p>
</body>
</html>
