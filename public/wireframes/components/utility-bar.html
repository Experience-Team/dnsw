<!-- Dev toolbar: the grid opens the wireframe index. Then the Rugby World Cup landing page: Latest is the
     page being worked on (always rugby-world-cup.html), followed by the saved versions (add one per version). -->
<div class="utility-bar" id="utility-bar">
  <div class="utility-bar-inner">
    <a href="/wireframes/index.html" class="utility-bar-grid" aria-label="Wireframe index" title="All wireframes">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="1" y="1" width="5.5" height="5.5" rx="1" fill="currentColor"/>
        <rect x="9.5" y="1" width="5.5" height="5.5" rx="1" fill="currentColor"/>
        <rect x="1" y="9.5" width="5.5" height="5.5" rx="1" fill="currentColor"/>
        <rect x="9.5" y="9.5" width="5.5" height="5.5" rx="1" fill="currentColor"/>
      </svg>
    </a>
    <nav class="utility-bar-variations" aria-label="Rugby World Cup page versions">
      <a href="../pages/rugby-world-cup.html">Latest</a>
      <a href="../pages/rugby-world-cup-v1.html">Rugby World Cup V1</a>
      <a href="../pages/rugby-world-cup-v2.html">Rugby World Cup V2</a>
    </nav>
  </div>
</div>
<script data-included>
(function () {
  var bar = document.getElementById('utility-bar');
  if (!bar) return;
  var lastY = window.scrollY;
  var ticking = false;

  function update() {
    var y = window.scrollY;
    var down = y > lastY && y > 48;
    bar.classList.toggle('utility-bar--hidden', down);
    document.body.classList.toggle('utility-bar-body--hidden', down);
    lastY = y;
    ticking = false;
  }

  window.addEventListener('scroll', function () {
    if (!ticking) {
      requestAnimationFrame(update);
      ticking = true;
    }
  }, { passive: true });

  // Highlight the version that is open
  var currentFile = window.location.pathname.split('/').pop();
  bar.querySelectorAll('.utility-bar-variations a[href]').forEach(function (link) {
    if (link.getAttribute('href').split('/').pop() === currentFile) {
      link.classList.add('active');
      link.setAttribute('aria-current', 'page');
    }
  });
})();
</script>
