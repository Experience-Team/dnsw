<div class="utility-bar" id="utility-bar">
  <div class="utility-bar-inner">
    <a href="/wireframes/index.html" class="utility-bar-grid" aria-label="Wireframe index" title="All wireframes">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="1" y="1" width="5.5" height="5.5" rx="1" fill="currentColor"/>
        <rect x="9.5" y="1" width="5.5" height="5.5" rx="1" fill="currentColor"/>
        <rect x="1" y="9.5" width="5.5" height="5.5" rx="1" fill="currentColor"/>
        <rect x="9.5" y="9.5" width="5.5" height="5.5" rx="1" fill="currentColor"/>
      </svg>
    </a>
    <nav class="utility-bar-variations" aria-label="Pages">
      <a href="../pages/home.html">Home</a>
      <a href="../pages/events.html">Events</a>
      <a href="../pages/accommodation.html">Accommodation</a>
      <div class="utility-bar-dropdown" id="utility-bar-western-sydney">
        <button type="button" class="utility-bar-dropdown-toggle" aria-haspopup="true" aria-expanded="false">
          Western Sydney <span class="utility-bar-dropdown-caret">▾</span>
        </button>
        <div class="utility-bar-dropdown-menu">
          <p class="utility-bar-dropdown-label">Western Sydney</p>
          <a href="../pages/western-sydney.html" class="utility-bar-dropdown-sub">Western Sydney V1</a>
          <a href="../pages/western-sydney-v2.html" class="utility-bar-dropdown-sub">Western Sydney V2</a>
          <a href="../pages/western-sydney-airport.html">Western Sydney Airport</a>
        </div>
      </div>
    </nav>
  </div>
</div>
<script data-included>
(function () {
  var bar = document.getElementById('utility-bar');
  if (!bar) return;
  var lastY = window.scrollY;
  var ticking = false;

  function update() {
    var y = window.scrollY;
    var down = y > lastY && y > 48;
    bar.classList.toggle('utility-bar--hidden', down);
    document.body.classList.toggle('utility-bar-body--hidden', down);
    lastY = y;
    ticking = false;
  }

  window.addEventListener('scroll', function () {
    if (!ticking) {
      requestAnimationFrame(update);
      ticking = true;
    }
  }, { passive: true });

  var dropdown = document.getElementById('utility-bar-western-sydney');
  if (dropdown) {
    var toggle = dropdown.querySelector('.utility-bar-dropdown-toggle');
    toggle.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = dropdown.classList.toggle('open');
      toggle.setAttribute('aria-expanded', open);
    });
    document.addEventListener('click', function () {
      dropdown.classList.remove('open');
      toggle.setAttribute('aria-expanded', 'false');
    });
  }
})();
</script>
