<script>
(function () {
  var site = document.body.dataset.site || 'sydney';
  // Set active toggle button
  document.getElementById(site === 'nsw' ? 'btn-nsw' : 'btn-sydney').classList.add('active');
  // Set logo text
  if (site === 'nsw') {
    var logoText = document.getElementById('nav-logo-text');
    logoText.innerHTML = 'visitnsw<span class="logo-dot">.</span>com';
  }
})();

function toggleSubmenu(id) {
  document.getElementById(id).classList.toggle('open');
}

function switchSite(site) {
  var base = window.location.pathname.replace(/\/pages\/[^/]+$/, '');
  window.location.href = base + '/pages/' + (site === 'sydney' ? 'home.html' : 'home-nsw.html');
}
</script>
