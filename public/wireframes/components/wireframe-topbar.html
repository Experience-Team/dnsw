<script data-included>
(function () {
  var bar = document.getElementById('wf-topbar');
  if (!bar) return;

  var type = document.body.dataset.pageType;
  if (type) {
    var tab = bar.querySelector('.wf-topbar-tabs a[data-type="' + type + '"]');
    if (tab) tab.classList.add('active');
  }

  // Hide-on-scroll-down, matching the utility bar's behaviour.
  var lastY = window.scrollY;
  var ticking = false;
  function update() {
    var y = window.scrollY;
    var down = y > lastY && y > 48;
    bar.classList.toggle('wf-topbar--hidden', down);
    document.body.classList.toggle('utility-bar-body--hidden', down);
    lastY = y;
    ticking = false;
  }
  window.addEventListener('scroll', function () {
    if (!ticking) {
      requestAnimationFrame(update);
      ticking = true;
    }
  }, { passive: true });
})();
</script>
