<!-- Flow chart (23 Nov): a tab of the prototype viewer, beside Option A and Option B. It needs no left panel (no
     description, switches or annotations), so the heading (RWC Flow Chart, no description) sits at the top with the
     tabs under it, and the chart has the rest of the window.
     Plan your 3rd half (23 Nov): the chart is flow-chart-planner.html, made with the flowchart skill
     (.claude/skills/flowchart) from the prototype's code, shown here in a frame that fills #pv-chart. It covers the
     planner and the parts of Home that touch it, Option A and Option B. It is a separate file because the skill's
     page carries its own styles and scripts; Open on its own gives it the whole window. -->
<body class="pv-page pv-page--chart">
<header class="pv-chart-top">
  <div class="pv-header">
    <h1 class="pv-title">RWC Flow Chart</h1>
  </div>
  <nav class="pv-tabs" aria-label="Prototypes"><a class="pv-tab" href="prototype-pick-your-team.html">Option A</a><a class="pv-tab" href="prototype-pick-your-team.html?flow=a">Option B</a><a class="pv-tab is-active" href="flow-chart.html" aria-current="page">Flow chart</a></nav>
</header>
<main class="pv-chart pv-chart--frame" id="pv-chart" aria-label="Flow chart">
  <p class="pv-chart-bar"><span>Made from the prototype&rsquo;s code on 23 Nov 2026.</span> <a href="flow-chart-planner.html" target="_blank" rel="noopener">Open on its own</a></p>
  <iframe class="pv-chart-frame" src="flow-chart-planner.html" title="Flow chart: Plan your 3rd half"></iframe>
</main>
</body>
</html>
