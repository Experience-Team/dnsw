<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wireframe — Your 3rd half plan</title>
  <link rel="stylesheet" href="../shared.css" />
  <link rel="stylesheet" href="../themes/sydney.css" id="theme-sheet" />
</head>
<body class="theme-sydney" data-site="sydney">

  <div data-include="../components/utility-bar.html"></div>
  <div data-include="../components/nav.html"></div>

  <div class="page-switcher-bar">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="#" class="crumb">Home</a>
      <span class="sep">›</span>
      <a href="rugby-world-cup.html" class="crumb">Rugby World Cup 2027</a>
      <span class="sep">›</span>
      <span class="crumb-active">Your 3rd half plan</span>
    </nav>
  </div>

  <!-- 3rd half planner results: built in the browser from the answers in the URL
       (team, m = match indexes, nights, city, who, interests, car). No answers = example plan. -->
  <main class="section plan-page">
    <div class="container pl-scope">

      <header class="plan-head">
        <p class="plan-kicker">Your 3rd half plan</p>
        <h1 class="plan-title" id="plan-title">Your plan</h1>
        <p class="plan-summary" id="plan-summary"></p>
        <p class="pl-row pl-row--notice plan-notice" id="plan-notice" hidden></p>
        <div class="plan-actions">
          <a class="pl-btn" href="rugby-world-cup.html#plan">Change your answers</a>
          <button type="button" class="pl-btn" id="plan-save" aria-pressed="false">Save plan</button>
          <button type="button" class="pl-btn" id="plan-share">Share</button>
          <span class="plan-take">
            <button type="button" class="pl-btn pl-btn-primary" id="plan-take" aria-expanded="false" aria-controls="plan-take-menu">Take it with you</button>
            <span class="plan-take-menu" id="plan-take-menu" hidden>
              <button type="button" class="pl-btn-link" data-take="calendar">Add matches to my calendar</button>
              <button type="button" class="pl-btn-link" data-take="email">Email me this plan</button>
              <button type="button" class="pl-btn-link" data-take="print">Print or save as PDF</button>
            </span>
          </span>
          <span class="pl-sm plan-status" id="plan-status" role="status"></span>
        </div>
      </header>

      <section class="plan-stay" aria-labelledby="plan-stay-title">
        <div class="plan-section-head">
          <h2 class="pl-lg" id="plan-stay-title">Where you'll stay</h2>
          <p class="pl-sm" id="plan-stay-note"></p>
        </div>
        <div id="plan-stay"></div>
      </section>

      <button type="button" class="pl-btn plan-map-toggle" id="plan-map-toggle" aria-expanded="false" aria-controls="plan-map">Show trip map</button>

      <div class="pl-plan plan-layout">
        <div class="pl-plan-timeline" id="plan-days"></div>
        <aside class="pl-plan-map plan-map" id="plan-map" aria-label="Trip map">
          <svg class="plan-map-svg" viewBox="0 0 280 300" role="img" aria-labelledby="plan-map-title">
            <title id="plan-map-title">Trip map: Newcastle to the north, Sydney to the south, joined by the train line.</title>
            <rect width="280" height="300" class="m-land"/>
            <path class="m-water" d="M280 0V300H236C228 240 246 180 232 120C222 70 240 30 228 0Z"/>
            <text x="262" y="160" class="m-label m-label--water" text-anchor="middle" transform="rotate(90 262 160)">Pacific Ocean</text>
            <path class="m-rail" d="M176 64C150 120 120 170 112 236"/>
            <text x="150" y="150" class="m-label m-label--small" text-anchor="start">About 3 hours by train</text>
            <circle cx="180" cy="58" r="22" class="m-park"/>
            <text x="180" y="30" class="m-label m-label--strong" text-anchor="middle">Newcastle</text>
            <circle cx="110" cy="244" r="30" class="m-park"/>
            <text x="110" y="290" class="m-label m-label--strong" text-anchor="middle">Sydney</text>
            <g id="plan-map-stops"></g>
          </svg>
          <ol class="pl-map-list" id="plan-map-list"></ol>
        </aside>
      </div>

    </div>
  </main>

  <div data-include="../components/footer.html"></div>
  <script src="../includes.js"></script>

  <script type="application/json" id="plan-fixtures">[{"iso": "2027-10-03", "teams": "Japan v Samoa", "stage": "Pool E", "venue": "Newcastle Stadium, Broadmeadow", "v": "ncl", "kickoff": "12:15pm", "pool": true}, {"iso": "2027-10-04", "teams": "Fiji v Spain", "stage": "Pool C", "venue": "Newcastle Stadium, Broadmeadow", "v": "ncl", "kickoff": "2:15pm", "pool": true}, {"iso": "2027-10-04", "teams": "Ireland v Portugal", "stage": "Pool D", "venue": "Sydney Football Stadium, Moore Park", "v": "sfs", "kickoff": "5:15pm", "pool": true}, {"iso": "2027-10-09", "teams": "New Zealand v Australia", "stage": "Pool A", "venue": "Stadium Australia, Sydney Olympic Park", "v": "sa", "kickoff": "5:10pm", "pool": true}, {"iso": "2027-10-11", "teams": "Uruguay v Portugal", "stage": "Pool D", "venue": "Newcastle Stadium, Broadmeadow", "v": "ncl", "kickoff": "5:15pm", "pool": true}, {"iso": "2027-10-11", "teams": "Italy v Romania", "stage": "Pool B", "venue": "Sydney Football Stadium, Moore Park", "v": "sfs", "kickoff": "7:45pm", "pool": true}, {"iso": "2027-10-16", "teams": "England v Wales", "stage": "Pool F", "venue": "Stadium Australia, Sydney Olympic Park", "v": "sa", "kickoff": "7:45pm", "pool": true}, {"iso": "2027-10-17", "teams": "Italy v Georgia", "stage": "Pool B", "venue": "Newcastle Stadium, Broadmeadow", "v": "ncl", "kickoff": "12:15pm", "pool": true}, {"iso": "2027-10-17", "teams": "France v Samoa", "stage": "Pool E", "venue": "Sydney Football Stadium, Moore Park", "v": "sfs", "kickoff": "7:45pm", "pool": true}, {"iso": "2027-10-23", "teams": "2nd Pool C v 2nd Pool F", "stage": "Round of 16 (1)", "venue": "Sydney Football Stadium, Moore Park", "v": "sfs", "kickoff": "2:15pm", "pool": false}, {"iso": "2027-10-24", "teams": null, "stage": "Round of 16 (2)", "venue": "Sydney Football Stadium, Moore Park", "v": "sfs", "kickoff": "4:45pm", "pool": false}, {"iso": "2027-10-30", "teams": null, "stage": "Quarter-final 1", "venue": "Stadium Australia, Sydney Olympic Park", "v": "sa", "kickoff": "4:45pm", "pool": false}, {"iso": "2027-10-31", "teams": null, "stage": "Quarter-final 2", "venue": "Stadium Australia, Sydney Olympic Park", "v": "sa", "kickoff": null, "pool": false}, {"iso": "2027-11-05", "teams": null, "stage": "Semi-final 1", "venue": "Stadium Australia, Sydney Olympic Park", "v": "sa", "kickoff": "9:00am", "pool": false}, {"iso": "2027-11-06", "teams": null, "stage": "Semi-final 2", "venue": "Stadium Australia, Sydney Olympic Park", "v": "sa", "kickoff": null, "pool": false}, {"iso": "2027-11-12", "teams": null, "stage": "Bronze Final", "venue": "Stadium Australia, Sydney Olympic Park", "v": "sa", "kickoff": "8:45am", "pool": false}, {"iso": "2027-11-13", "teams": null, "stage": "Final", "venue": "Stadium Australia, Sydney Olympic Park", "v": "sa", "kickoff": "8:00pm", "pool": false}]</script>

  <script>
  (function () {
    var FIX = JSON.parse(document.getElementById('plan-fixtures').textContent);
    var q = new URLSearchParams(location.search);
    var example = !q.get('team');
    var team = q.get('team') || 'Samoa';
    var picked = (q.get('m') || '').split(',').filter(Boolean).map(Number).filter(function (i) { return FIX[i]; });
    if (example || !picked.length) picked = FIX.map(function (f, i) { return i; }).filter(function (i) { return FIX[i].pool && FIX[i].teams.split(' v ').indexOf(team) > -1; });
    var nights = Math.min(5, Math.max(1, parseInt(q.get('nights') || '4', 10)));
    var city = q.get('city') || 'both';
    var who = q.get('who') || 'friends';
    var interests = (q.get('interests') || 'food,beaches').split(',').filter(Boolean);
    var car = q.get('car') === '1';
    if (!interests.length) interests = ['food'];

    var CAT = {
      food: { e: '🍽️', l: 'Food and drink', items: ['Harbourside seafood lunch', 'Laneway dumpling bar', 'Brunch café with long tables', 'Pub with a big beer garden', 'Night market food stalls', 'Rooftop pizza and spritz'] },
      beaches: { e: '🏖️', l: 'Beaches', items: ['Ocean pool swim', 'Calm-water harbour beach', 'Beginners surf lesson', 'Clifftop walk to the beach'] },
      nature: { e: '🌿', l: 'Nature', items: ['Bushwalk with water views', 'Botanic garden wander', 'Mangrove kayak trip', 'Sunset lookout'] },
      nightlife: { e: '🌃', l: 'Nightlife', items: ['Rooftop bar with city views', 'Live music pub', 'Late-night cocktail bar', 'Karaoke rooms for groups'] },
      culture: { e: '🎭', l: 'Culture', items: ['Free art gallery', 'Aboriginal-led walking tour', 'City history museum', 'Theatre show'] },
      sport: { e: '🏟️', l: 'Sport', items: ['Rugby pub showing every match', 'Stadium behind-the-scenes tour', 'Ten-pin and arcade bar', 'Touch footy in the park'] }
    };
    var AREAS = {
      sydney: ['Darling Harbour', 'Surry Hills', 'Bondi', 'The Rocks', 'Newtown', 'Manly', 'Barangaroo', 'Coogee'],
      newcastle: ['Newcastle', 'Honeysuckle', 'Merewether', 'Hamilton', 'Bar Beach', 'Cooks Hill'],
      sa: ['Sydney Olympic Park', 'Wentworth Point', 'Homebush'],
      sfs: ['Moore Park', 'Paddington', 'Surry Hills'],
      ncl: ['Broadmeadow', 'Hamilton', 'Newcastle']
    };
    var VENUE_CITY = { sa: 'sydney', sfs: 'sydney', ncl: 'newcastle' };
    var CITY_NAME = { sydney: 'Sydney', newcastle: 'Newcastle' };
    var WHO = { friends: 'with friends', solo: 'solo', couple: 'as a couple', family: 'with family' };

    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function day(iso) { return new Date(iso + 'T12:00:00'); }
    function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
    function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
    function fmt(d) { return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()] + ' ' + d.getDate() + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getMonth()]; }
    function hour(ko) { if (!ko) return null; var m = ko.match(/(\d+):(\d+)(am|pm)/); var h = +m[1] % 12; return m[3] === 'pm' ? h + 12 : h; }

    // Trip dates: share the nights across the picked matches, sleeping after each match so there's a 3rd half.
    // Matches close together merge into one trip; far apart ones become separate short trips.
    // "5 nights or more" (5) stretches to cover every match in one stay.
    var matches = picked.map(function (i) { return FIX[i]; }).sort(function (a, b) { return a.iso < b.iso ? -1 : 1; });
    var span = Math.round((day(matches[matches.length - 1].iso) - day(matches[0].iso)) / 86400000);
    var trips = [];
    if (nights === 5 && span >= 5) {
      trips = [{ start: addDays(day(matches[0].iso), -1), n: span + 2 }];
    } else {
      var k = matches.length;
      matches.forEach(function (m, idx) {
        var n = Math.floor(nights / k) + (idx < nights % k ? 1 : 0);
        var st = addDays(day(m.iso), -Math.floor(n / 2));
        var prev = trips[trips.length - 1];
        if (prev && st <= addDays(prev.start, prev.n)) {
          var end = Math.max(+addDays(prev.start, prev.n), +addDays(st, n));
          prev.n = Math.round((end - prev.start) / 86400000);
        } else trips.push({ start: st, n: n });
      });
    }
    var days = [], tripOf = [];
    trips.forEach(function (t, ti) { for (var i = 0; i <= t.n; i++) { days.push(addDays(t.start, i)); tripOf.push(ti); } });
    nights = trips.reduce(function (sum, t) { return sum + t.n; }, 0);

    function matchOn(d) { return matches.filter(function (m) { return m.iso === iso(d); })[0]; }
    function nearestCity(d) {
      var best = null, gap = 1e9;
      matches.forEach(function (m) { var g = Math.abs(day(m.iso) - d); if (g < gap || (g === gap && day(m.iso) > d)) { gap = g; best = m; } });
      return VENUE_CITY[best.v];
    }
    function baseFor(d) { return city === 'both' ? nearestCity(d) : city; }

    var seed = 0;
    function pick(arr) { return arr[(seed++ * 7 + 3) % arr.length]; }
    function catsFor(slot) {
      var list = interests.slice();
      if (who === 'family') list = list.map(function (c) { return c === 'nightlife' ? 'food' : c; });
      if (slot === 'after' && interests.indexOf('nightlife') > -1 && who !== 'family') list = ['nightlife'].concat(list);
      if (slot === 'before') list = ['food'].concat(list);
      return list;
    }
    var cardId = 0;
    function option(cat, area, why, used) {
      var c0 = CAT[cat], nm = pick(c0.items), tries = 0;
      while (used && used.indexOf(nm) > -1 && tries++ < c0.items.length) nm = c0.items[(c0.items.indexOf(nm) + 1) % c0.items.length];
      if (used) used.push(nm);
      var c = CAT[cat], id = 'opt-' + (++cardId);
      return '<article class="pl-option plan-option" id="' + id + '" data-cat="' + cat + '" data-area="' + esc(area) + '">' +
        '<div class="ph-img plan-option-img"></div>' +
        '<span class="pl-tag">' + c.e + ' ' + c.l + '</span>' +
        '<h4 class="pl-option-name">' + esc(nm) + '</h4>' +
        '<p class="pl-sm"><span class="plan-area">' + esc(pick(AREAS[area] || AREAS.sydney)) + '</span>' + (why ? ' &middot; ' + esc(why) : '') + '</p>' +
        '<div class="pl-option-controls"><button type="button" class="pl-btn" data-add aria-pressed="false">Add to plan</button><button type="button" class="pl-btn" data-another>Show another</button></div>' +
        '</article>';
    }
    function gap(label, sub, slot, area, why) {
      var cats = catsFor(slot), cards = '', used = [];
      for (var j = 0; j < 3; j++) cards += option(cats[j % cats.length], area, why, used);
      return '<div class="pl-gap"><span class="pl-lg plan-gap-label">' + label + '</span><span class="pl-sm">' + sub + '</span></div><div class="pl-options">' + cards + '</div>';
    }
    function row(text, cls) { return '<p class="pl-row ' + (cls || '') + '">' + text + '</p>'; }
    function travel(from, to) {
      return car ? 'Drive from ' + CITY_NAME[from] + ' to ' + CITY_NAME[to] + ', about 2 hours on the M1'
                 : 'Train from ' + CITY_NAME[from] + ' to ' + CITY_NAME[to] + ', about 3 hours';
    }

    var html = '', stops = [], prevBase = null;
    days.forEach(function (d, n) {
      var m = matchOn(d), base = baseFor(d), parts = '';
      var isFirst = n === 0 || tripOf[n] !== tripOf[n - 1], isLast = n === days.length - 1 || tripOf[n] !== tripOf[n + 1];
      if (isFirst && n > 0) {
        var home = Math.round((d - days[n - 1]) / 86400000) - 1;
        html += '<p class="plan-between">Home for ' + home + (home === 1 ? ' day' : ' days') + '. Your plan picks up again on ' + fmt(d) + '.</p>';
        prevBase = null;
      }
      if (prevBase && base !== prevBase) parts += row(travel(prevBase, base));
      if (isFirst) parts += row(isLast ? 'Day trip: no overnight stay' : 'Arrive and check in to your stay in ' + CITY_NAME[base]);
      if (m) {
        var mc = VENUE_CITY[m.v], h = hour(m.kickoff);
        if (mc !== base) parts += row('Day trip to ' + CITY_NAME[mc] + ': ' + (car ? 'about 2 hours each way by car' : 'about 3 hours each way by train') + '. Head back after the match.');
        parts += gap(h !== null && h < 13 ? 'Before kick-off: breakfast nearby' : 'Before kick-off', h !== null && h < 13 ? 'Morning' : 'Afternoon', 'before', m.v, 'near the stadium');
        parts += '<article class="pl-match' + (m.kickoff ? '' : ' is-tbc') + '"><div class="pl-match-time"><span class="pl-sm">' + fmt(d) + '</span><span class="pl-lg">' + (m.kickoff || 'TBC') + '</span><span class="pl-sm">' + (m.kickoff ? 'Kick-off, AEDT' : 'Kick-off to be confirmed') + '</span></div>' +
          '<div class="pl-match-body"><span class="pl-tag">' + esc(m.stage) + '</span><h3 class="pl-lg">' + esc(m.teams || 'Teams to be confirmed') + '</h3><span class="pl-sm">' + esc(m.venue) + '</span></div>' +
          '<a href="#" class="pl-match-link">Getting to the stadium</a></article>';
        parts += mc === 'sydney'
          ? row('<strong>Fan zone:</strong> Tumbalong Park, Darling Harbour is open all day with big screens, food and live music.', 'plan-row-fan')
          : row('<strong>Match-day zone</strong> at Newcastle Stadium (to be confirmed).', 'plan-row-fan');
        parts += m.kickoff ? gap('Your 3rd half', 'After the match', 'after', m.v, 'after the game')
                           : row('We\'ll suggest your 3rd half once the kick-off time is confirmed.');
        stops.push({ d: d, city: mc, label: (m.teams || m.stage) });
      } else {
        if (!isFirst) parts += gap('Morning', 'Free time', 'free', base, '');
        if (!isLast) parts += gap(isFirst ? 'This afternoon' : 'Afternoon', 'Free time', 'free', base, '');
        if (!isLast) parts += gap(who === 'family' ? 'Early evening' : 'Tonight', 'Free time', 'after', base, '');
        stops.push({ d: d, city: base, label: isFirst ? 'Arrive' : isLast ? 'Head home' : 'Free day' });
      }
      if (isLast && !isFirst) parts += row('Check out and head home');
      html += '<section class="pl-day plan-day" aria-labelledby="day-' + n + '"><div class="pl-day-head"><h2 class="pl-lg" id="day-' + n + '">Day ' + (n + 1) + ' &middot; ' + fmt(d) + '</h2>' +
        '<span class="pl-sm">' + (m ? 'Match day in ' + CITY_NAME[VENUE_CITY[m.v]] : 'In ' + CITY_NAME[base]) + '</span></div>' + parts + '</section>';
      prevBase = base;
    });
    document.getElementById('plan-days').innerHTML = html;

    // Header
    var cities = days.map(baseFor).concat(matches.map(function (m) { return VENUE_CITY[m.v]; })).filter(function (c, i, a) { return a.indexOf(c) === i; });
    document.getElementById('plan-title').textContent = team + ' in ' + cities.map(function (c) { return CITY_NAME[c]; }).join(' and ');
    var ints = interests.map(function (c) { return CAT[c] ? CAT[c].e + ' ' + CAT[c].l.toLowerCase() : c; });
    document.getElementById('plan-summary').textContent =
      trips.map(function (t) { return t.n ? fmt(t.start) + ' to ' + fmt(addDays(t.start, t.n)) : fmt(t.start); }).join(' and ') + ' 2027 · ' + nights + (nights === 1 ? ' night' : ' nights') + ' · ' +
      matches.length + (matches.length === 1 ? ' match' : ' matches') + ' · ' + WHO[who] + ' · into ' + ints.join(', ') + ' · ' + (car ? 'with a car' : 'no car');
    var notice = document.getElementById('plan-notice');
    if (example) { notice.hidden = false; notice.textContent = 'This is an example plan for Samoa fans. Change your answers to build your own.'; }
    else if (trips.length > 1) { notice.hidden = false; notice.textContent = 'Your matches are ' + span + ' days apart, so we\'ve planned ' + trips.length + ' short trips. To stay the whole time, choose 5 nights or more.'; }

    // Where you'll stay: one group per city you sleep in
    var sleepDays = days.filter(function (d, n) { return !(n === days.length - 1 || tripOf[n] !== tripOf[n + 1]); });
    var stayCities = sleepDays.map(baseFor).filter(function (c, i, a) { return a.indexOf(c) === i; });
    var KIND = ['Hotel', 'Apartment', 'Hotel'];
    var NAME = { sydney: ['Harbour-view hotel', 'Apartment hotel with kitchen', 'Boutique hotel near the light rail'], newcastle: ['Beachside hotel', 'Apartment near the foreshore', 'Hotel near Broadmeadow station'] };
    var stayHtml = stayCities.map(function (c) {
      var nightsHere = sleepDays.filter(function (d) { return baseFor(d) === c; }).length;
      return '<div class="plan-stay-group"><h3 class="pl-sm plan-stay-city">' + CITY_NAME[c] + ', ' + nightsHere + (nightsHere === 1 ? ' night' : ' nights') + '</h3><div class="pl-options">' +
        NAME[c].map(function (nm, k) {
          return '<article class="pl-option plan-stay-option"><div class="ph-img plan-stay-img"></div><div class="plan-stay-body">' +
            '<span class="pl-tag"><span class="provenance-gap">' + KIND[k] + '</span></span><h4 class="pl-option-name">' + nm + '</h4>' +
            '<p class="pl-sm">' + pick(AREAS[c]) + '</p>' +
            '<div class="pl-option-controls"><button type="button" class="pl-btn" data-stay aria-pressed="false">Choose</button><a class="pl-btn" href="#">See rooms</a></div></div></article>';
        }).join('') + '</div></div>';
    }).join('');
    document.getElementById('plan-stay').innerHTML = stayHtml || '<p class="pl-row">Your plan is all day trips, so there\'s nowhere to stay yet. Add a night to see places near your matches.</p>';
    document.getElementById('plan-stay-note').textContent = 'Picked for where your matches are. Choose one per city.';

    // Trip map stops
    var POS = { sydney: [110, 244], newcastle: [180, 58] }, used = { sydney: 0, newcastle: 0 }, svg = '';
    stops.forEach(function (s, n) {
      var p = POS[s.city], k = used[s.city]++, a = (k / 6) * Math.PI * 2, r = 14;
      var x = p[0] + Math.cos(a) * r, y = p[1] + Math.sin(a) * r;
      svg += '<g class="plan-stop"><circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="8"/><text x="' + x.toFixed(1) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="middle">' + (n + 1) + '</text></g>';
    });
    document.getElementById('plan-map-stops').innerHTML = svg;
    document.getElementById('plan-map-list').innerHTML = stops.map(function (s, n) {
      return '<li class="pl-map-stop"><span class="pl-map-stop-n">' + (n + 1) + '</span><span><strong>' + fmt(s.d) + '</strong> ' + CITY_NAME[s.city] + ' &middot; ' + esc(s.label) + '</span></li>';
    }).join('');

    // Interactions
    var status = document.getElementById('plan-status');
    function say(t) { status.textContent = t; }
    document.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      if (b.hasAttribute('data-add')) {
        var on = b.getAttribute('aria-pressed') !== 'true';
        b.setAttribute('aria-pressed', String(on));
        b.textContent = on ? 'Added' : 'Add to plan';
        b.closest('.pl-option').classList.toggle('is-chosen', on);
        say(document.querySelectorAll('[data-add][aria-pressed="true"]').length + ' added to your plan');
      } else if (b.hasAttribute('data-another')) {
        var card = b.closest('.pl-option'), c = CAT[card.dataset.cat];
        var nameEl = card.querySelector('.pl-option-name');
        nameEl.textContent = c.items[(c.items.indexOf(nameEl.textContent) + 1) % c.items.length];
        card.querySelector('.plan-area').textContent = pick(AREAS[card.dataset.area] || AREAS.sydney);
      } else if (b.hasAttribute('data-stay')) {
        var group = b.closest('.pl-options');
        group.querySelectorAll('[data-stay]').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); x.textContent = 'Choose'; x.closest('.pl-option').classList.remove('is-chosen'); });
        b.setAttribute('aria-pressed', 'true'); b.textContent = 'Chosen'; b.closest('.pl-option').classList.add('is-chosen');
      } else if (b.id === 'plan-save') {
        var s = b.getAttribute('aria-pressed') !== 'true';
        b.setAttribute('aria-pressed', String(s)); b.textContent = s ? 'Saved' : 'Save plan';
        say(s ? 'Plan saved to your favourites' : 'Plan removed from your favourites');
      } else if (b.id === 'plan-share') {
        if (navigator.clipboard) navigator.clipboard.writeText(location.href).catch(function () {});
        say('Link copied. Anyone with it can see this plan.');
      } else if (b.id === 'plan-take') {
        var menu = document.getElementById('plan-take-menu'), open = menu.hidden;
        menu.hidden = !open; b.setAttribute('aria-expanded', String(open));
      } else if (b.dataset.take) {
        document.getElementById('plan-take-menu').hidden = true;
        document.getElementById('plan-take').setAttribute('aria-expanded', 'false');
        if (b.dataset.take === 'print') window.print();
        else say(b.dataset.take === 'calendar' ? 'Your matches are ready to add to your calendar.' : 'We\'ll email this plan to you.');
      } else if (b.id === 'plan-map-toggle') {
        var mapOpen = b.getAttribute('aria-expanded') !== 'true';
        b.setAttribute('aria-expanded', String(mapOpen));
        b.textContent = mapOpen ? 'Hide trip map' : 'Show trip map';
        document.getElementById('plan-map').classList.toggle('is-open', mapOpen);
      }
    });
  })();
  </script>
</body>
</html>
