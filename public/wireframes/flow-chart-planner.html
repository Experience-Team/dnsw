        if (nodeBox.x1 < -1 || nodeBox.y1 < -1 || nodeBox.x2 > containerBox.width + 1 || nodeBox.y2 > containerBox.height + 1) {
          issues.push({
            severity: "error",
            type: "node-clipped",
            message: `${context}: ${nodes[i].id()} is clipped by the graph viewport`,
            node: nodes[i].id(),
            box: {
              x1: Math.round(nodeBox.x1),
              y1: Math.round(nodeBox.y1),
              x2: Math.round(nodeBox.x2),
              y2: Math.round(nodeBox.y2)
            },
            viewport: {
              width: Math.round(containerBox.width),
              height: Math.round(containerBox.height)
            }
          });
        }
      }

      for (const edge of edges) {
        const edgeWidth = Number(edge.data("width")) || 0;
        if (edgeWidth < MIN_EDGE_WIDTH) {
          issues.push({
            severity: "error",
            type: "edge-too-thin",
            message: `${context}: ${edge.id()} is thinner than ${MIN_EDGE_WIDTH}px`,
            edge: edge.id(),
            width: edgeWidth
          });
        }
        const edgeLabel = String(edge.style("label") || "").trim();
        if (edgeLabel) {
          issues.push({
            severity: "error",
            type: "edge-label-rendered",
            message: `${context}: ${edge.id()} renders a canvas label`,
            edge: edge.id(),
            label: edgeLabel
          });
        }
        const segments = approximateTaxiSegments(edge, boxesById);
        for (const node of nodes) {
          if (node.id() === edge.source().id() || node.id() === edge.target().id()) continue;
          const box = inflatedRect(boxesById.get(node.id()), -4);
          if (segments.some((segment) => segmentIntersectsRect(segment, box))) {
            issues.push({
              severity: "error",
              type: "edge-through-node",
              message: `${context}: ${edge.id()} crosses behind ${node.id()}`,
              edge: edge.id(),
              node: node.id()
            });
          }
        }
      }
      issues.push(...auditParallelEdgeSpacing(edges, boxesById, context));
      issues.push(...auditEdgeSegmentSpacing(edges, boxesById, context));

      const renderedNodeFonts = nodes.map((node) => parseFloat(node.style("font-size")) * instance.zoom());
      const renderedEdgeFonts = edges.map((edge) => parseFloat(edge.style("font-size")) * instance.zoom());
      const minNodeFont = renderedNodeFonts.length ? Math.min(...renderedNodeFonts) : Infinity;
      const minEdgeFont = renderedEdgeFonts.length ? Math.min(...renderedEdgeFonts) : Infinity;
      if (nodes.length && minNodeFont < MIN_NODE_FONT_PIXELS - 0.05) {
        issues.push({
          severity: "error",
          type: "node-font-too-small",
          message: `${context}: node font renders below ${MIN_NODE_FONT_PIXELS}px`,
          renderedPixels: Number(minNodeFont.toFixed(2))
        });
      }
      if (edges.length && minEdgeFont < MIN_EDGE_FONT_PIXELS - 0.05) {
        issues.push({
          severity: "error",
          type: "edge-font-too-small",
          message: `${context}: edge font renders below ${MIN_EDGE_FONT_PIXELS}px`,
          renderedPixels: Number(minEdgeFont.toFixed(2))
        });
      }

      return {
        context,
        nodes: nodes.length,
        edges: edges.length,
        zoom: Number(instance.zoom().toFixed(3)),
        issues
      };
    }

    function auditActionBadges(instance, context) {
      renderActionBadges(instance);
      const issues = [];
      const overlay = overlayForInstance(instance);
      const container = instance.container();
      if (!overlay || !container) return issues;

      const containerRect = container.getBoundingClientRect();
      const buttons = Array.from(overlay.querySelectorAll(".node-action-badge"));
      const expectedActions = instance.nodes().toArray().flatMap((element) => {
        const id = element.id();
        const node = nodesById.get(id);
        if (!node) return [];
        return [
          ...(childrenOf(id).length > 0 ? [`${id}:subgraph`] : []),
          ...(hasOpenableContent(node) ? [`${id}:content`] : [])
        ];
      });
      const actualActions = new Set(buttons.map((button) => `${button.dataset.nodeId}:${button.dataset.action}`));

      for (const key of expectedActions) {
        if (!actualActions.has(key)) {
          const [id, action] = key.split(":");
          issues.push({
            severity: "error",
            type: "action-badge-missing",
            message: `${context}: missing ${action} action badge for ${id}`,
            node: id,
            action
          });
        }
      }

      const nodeBoxes = new Map(instance.nodes().toArray().map((node) => [
        node.id(),
        node.renderedBoundingBox({
          includeLabels: false,
          includeOverlays: false,
          includeUnderlays: false
        })
      ]));
      const nodeElements = new Map(instance.nodes().toArray().map((node) => [node.id(), node]));

      function renderedLabelBox(element, ownerBox) {
        const lines = String(element.data("displayLabel") || element.data("label") || "")
          .split(/\n/)
          .filter(Boolean);
        if (!lines.length) return null;
        const zoom = Math.max(0.001, instance.zoom());
        const fontSize = parseFloat(element.style("font-size")) * zoom;
        const lineHeight = fontSize * 1.18;
        const longestLine = Math.max(...lines.map((line) => line.length));
        const width = Math.min(ownerBox.x2 - ownerBox.x1 - 10, Math.max(12, longestLine * fontSize * 0.58));
        const height = Math.max(lineHeight, lines.length * lineHeight);
        const centerX = (ownerBox.x1 + ownerBox.x2) / 2;
        const centerY = (ownerBox.y1 + ownerBox.y2) / 2;
        return {
          x1: centerX - width / 2,
          y1: centerY - height / 2,
          x2: centerX + width / 2,
          y2: centerY + height / 2
        };
      }

      for (const button of buttons) {
        const rect = button.getBoundingClientRect();
        const badgeRect = {
          x1: rect.left - containerRect.left,
          y1: rect.top - containerRect.top,
          x2: rect.right - containerRect.left,
          y2: rect.bottom - containerRect.top
        };
        const width = rect.width;
        const height = rect.height;
        if (width < MIN_BADGE_SIZE || height < MIN_BADGE_SIZE) {
          issues.push({
            severity: "error",
            type: "action-badge-too-small",
            message: `${context}: action badge for ${button.dataset.nodeId} is too small`,
            node: button.dataset.nodeId,
            width: Math.round(width),
            height: Math.round(height)
          });
        }
        if (badgeRect.x1 < 0 || badgeRect.y1 < 0 || badgeRect.x2 > container.clientWidth || badgeRect.y2 > container.clientHeight) {
          issues.push({
            severity: "error",
            type: "action-badge-clipped",
            message: `${context}: action badge for ${button.dataset.nodeId} is clipped`,
            node: button.dataset.nodeId
          });
        }
        const ownerBox = nodeBoxes.get(button.dataset.nodeId);
        if (!ownerBox) continue;
        const rightAnchored = badgeRect.x1 <= ownerBox.x2 + 2 && badgeRect.x2 >= ownerBox.x2 - 2;
        const leftAnchored = badgeRect.x1 <= ownerBox.x1 + 2 && badgeRect.x2 >= ownerBox.x1 - 2;
        const horizontallyAnchored = rightAnchored || leftAnchored;
        const topAnchored = badgeRect.y1 <= ownerBox.y1 + 2 && badgeRect.y2 >= ownerBox.y1 - 2;
        const bottomAnchored = badgeRect.y1 <= ownerBox.y2 + 2 && badgeRect.y2 >= ownerBox.y2 - 2;
        const verticallyAnchored = topAnchored || bottomAnchored;
        if (!horizontallyAnchored || !verticallyAnchored) {
          issues.push({
            severity: "error",
            type: "action-badge-not-corner-anchored",
            message: `${context}: action badge for ${button.dataset.nodeId} is not anchored across an owner corner`,
            node: button.dataset.nodeId,
            action: button.dataset.action
          });
        }
        const labelSafeBox = {
          x1: ownerBox.x1 + 30,
          y1: ownerBox.y1 + 24,
          x2: ownerBox.x2 - 30,
          y2: ownerBox.y2 - 24
        };
        const ownerElement = nodeElements.get(button.dataset.nodeId);
        const actualLabelBox = ownerElement ? renderedLabelBox(ownerElement, ownerBox) : null;
        if (
          rectIntersectionArea(badgeRect, labelSafeBox) > 1
          || (actualLabelBox && rectIntersectionArea(badgeRect, inflatedRect(actualLabelBox, 2)) > 1)
        ) {
          issues.push({
            severity: "error",
            type: "action-badge-label-overlap",
            message: `${context}: action badge for ${button.dataset.nodeId} intrudes into the label area`,
            node: button.dataset.nodeId,
            action: button.dataset.action
          });
        }
        for (const [nodeId, nodeBox] of nodeBoxes) {
          if (nodeId === button.dataset.nodeId) continue;
          if (rectIntersectionArea(badgeRect, inflatedRect(nodeBox, 1)) > 1) {
            issues.push({
              severity: "error",
              type: "action-badge-overlap",
              message: `${context}: action badge for ${button.dataset.nodeId} overlaps ${nodeId}`,
              badgeNode: button.dataset.nodeId,
              node: nodeId
            });
          }
        }
      }

      return issues;
    }

    function llmFragmentRoles(node) {
      const text = [
        node.label,
        node.type,
        node.summary,
        node.description,
        ...(node.badges || [])
      ].filter(Boolean).join(" ").toLowerCase();
      const roles = [];
      if ((node.type || "").toLowerCase() === "prompt" || /\b(prompt|template|rubric|system message|developer message|user message|messages?)\b/.test(text)) {
        roles.push("prompt-detail");
      }
      if (/\b(assemble|build|render|format|compose|fill|prepare)\b.{0,44}\b(prompt|template|message|context)\b/.test(text)) {
        roles.push("prompt-assembly");
      }
      if (/\b(call|invoke|query|ask|send|run|complete|infer)\b.{0,44}\b(llm|model|gpt|claude|openai|anthropic|completion|chat)\b/.test(text) || /\b(llm|model)\s+call\b/.test(text)) {
        roles.push("model-invocation");
      }
      if (/\b(parse|extract|deserialize|validate|normalize|repair)\b.{0,44}\b(response|json|schema|output|result|answer|structured output)\b/.test(text)) {
        roles.push("response-parsing");
      }
      if (/\b(write|save|capture|store)\b.{0,44}\b(response|output|result|answer|artifact)\b/.test(text)) {
        roles.push("output-capture");
      }
      return roles;
    }

    function isLlmCallNode(node) {
      return (node.type || "").toLowerCase() === "llm-call";
    }

    function hasPromptOrTemplateContent(node) {
      return (node.prompts || []).some((item) => item && (item.content || item.excerpt));
    }

    function hasLlmCallSignals(node, roles) {
      const type = (node.type || "").toLowerCase();
      return Boolean(
        node.model
        || (type === "subagent" && hasPromptOrTemplateContent(node))
        || (roles.includes("model-invocation") && (node.prompts || []).length)
      );
    }

    function hasOwnerAgentTurnSignals(node) {
      const text = [
        node.label,
        node.type,
        node.summary,
        node.description,
        ...(node.badges || [])
      ].filter(Boolean).join(" ").toLowerCase();
      return /\b(owner step|owner-agent|owner agent|main agent|agent turn|model turn)\b/.test(text);
    }

    function isAgentSkillMap() {
      const metadata = DATA.metadata && typeof DATA.metadata === "object" ? DATA.metadata : {};
      const text = [
        DATA.title,
        DATA.subtitle,
        metadata.purpose,
        metadata.sourceRoot,
        metadata.generatedBy
      ].filter(Boolean).join(" ").toLowerCase();
      return /\b(agent|skill|subagent)\b/.test(text) && (DATA.nodes || []).some(isLlmCallNode);
    }

    function hasSubstantialDeterministicEvidence(node) {
      const evidence = Array.isArray(node.evidence) ? node.evidence : [];
      return evidence.some((item) => {
        const pathText = String(item && item.path ? item.path : "").toLowerCase();
        const noteText = String(item && item.note ? item.note : "").toLowerCase();
        return /(^|\/)(scripts?|src|lib|bin|cmd|app|packages?)\//.test(pathText)
          || /\.(py|js|mjs|cjs|ts|tsx|jsx|go|rs|java|rb|php|sh|bash|zsh|ps1)$/.test(pathText)
          || /\b(script|tool|command|function|handler|module|deterministic)\b/.test(noteText);
      });
    }

    function isProcessDecisionOrNote(node) {
      return ["process", "decision", "note"].includes((node.type || "").toLowerCase());
    }

    function parentSuggestsCognitiveReview(node) {
      const text = [
        node.label,
        node.type,
        node.summary,
        node.description,
        ...(node.badges || [])
      ].filter(Boolean).join(" ").toLowerCase();
      return /\b(evaluate|evaluation|judge|judging|review|reviewing|prune|pruning|choose|choosing|check|checking)\b/.test(text);
    }

    function auditColorPolicy() {
      const issues = [];
      const ungroupedCustomColors = (DATA.nodes || []).filter((node) => node.color && !rawColorGroup(node));
      if (ungroupedCustomColors.length) {
        issues.push({
          severity: "error",
          type: "ungrouped-node-color",
          message: "node colors must represent real groups; use colorGroup or omit color",
          nodes: ungroupedCustomColors.map((node) => node.id)
        });
      }
      if (colorGroupKeys.length && !useColorGroups) {
        issues.push({
          severity: "error",
          type: "too-many-color-groups",
          message: "color groups are too close to one color per node; omit color groups or consolidate them into real categories",
          colorGroups: colorGroupKeys,
          coloredNodeCount
        });
      }
      const legendSection = document.getElementById("legend-section");
      if (!useColorGroups && legendSection && legendSection.style.display !== "none") {
        issues.push({
          severity: "error",
          type: "legend-without-color-groups",
          message: "legend is visible even though node color is not carrying real group meaning"
        });
      }
      return issues;
    }

    function auditModalNavigation() {
      const issues = [];
      for (const id of []) { // dnsw change: close crosses are wanted (CLAUDE.md check 10)
        if (document.getElementById(id)) {
          issues.push({
            severity: "error",
            type: "modal-close-button",
            message: `${id} exists; clicking outside is the close affordance`
          });
        }
      }
      if (document.getElementById("content-modal").classList.contains("visible") && contentState.returnSubgraph) {
        const backButton = document.getElementById("back-content-button");
        if (!backButton || backButton.classList.contains("hidden")) {
          issues.push({
            severity: "error",
            type: "content-back-missing",
            message: "content opened from a subgraph must show a prominent Back button"
          });
        }
      }
      if (document.getElementById("content-modal").classList.contains("visible")) {
        const summaryText = document.getElementById("content-summary-text");
        if (!summaryText || !summaryText.textContent.trim()) {
          issues.push({
            severity: "error",
            type: "content-summary-empty",
            message: "content modal must show a prose summary above the formatted/plain text tabs"
          });
        }
        const panel = document.querySelector("#content-modal .content-panel");
        if (panel) {
          for (const selector of [".modal-header", ".content-summary", ".content-toolbar"]) {
            const element = panel.querySelector(selector);
            if (element && element.scrollWidth > element.clientWidth + 1) {
              issues.push({
                severity: "error",
                type: "content-modal-horizontal-overflow",
                message: `content modal ${selector} overflows horizontally`
              });
            }
          }
          const panelRect = panel.getBoundingClientRect();
          for (const element of panel.querySelectorAll(".content-toolbar > *, .modal-header > *")) {
            const rect = element.getBoundingClientRect();
            if (rect.left < panelRect.left - 1 || rect.right > panelRect.right + 1) {
              issues.push({
                severity: "error",
                type: "content-modal-horizontal-overflow",
                message: "content modal controls are clipped horizontally"
              });
              break;
            }
          }
        }
      }
      return issues;
    }

    function auditContentSummaries() {
      const issues = [];
      for (const node of DATA.nodes || []) {
        for (const collectionName of ["prompts", "artifacts"]) {
          const collection = node[collectionName] || [];
          collection.forEach((item, index) => {
            if (!item || !(item.content || item.excerpt)) return;
            if (!item.summary || !String(item.summary).trim()) {
              issues.push({
                severity: "error",
                type: "content-summary-missing",
                message: `${node.id} ${collectionName}[${index}] has text content but no prose summary`,
                node: node.id,
                collection: collectionName,
                index
              });
            }
          });
        }
      }
      return issues;
    }

    function auditLlmCallGranularity() {
      const issues = [];
      const groups = new Map();
      for (const node of DATA.nodes || []) {
        const roles = llmFragmentRoles(node);
        if (isLlmCallNode(node)) {
          if (childrenOf(node.id).length) {
            issues.push({
              severity: "error",
              type: "llm-call-has-children",
              message: `${node.id} is an LLM-call node and must not be decomposed into child blocks`,
              node: node.id,
              children: childrenOf(node.id)
            });
          }
          if (!node.model || !String(node.model).trim()) {
            issues.push({
              severity: "error",
              type: "llm-call-missing-model",
              message: `${node.id} is an LLM-call node but has no model`,
              node: node.id
            });
          }
          if (!hasPromptOrTemplateContent(node)) {
            issues.push({
              severity: "error",
              type: "llm-call-missing-prompt",
              message: `${node.id} is an LLM-call node but has no prompt/template content`,
              node: node.id
            });
          }
        } else if (hasLlmCallSignals(node, roles)) {
          issues.push({
            severity: "error",
            type: "llm-call-type-missing",
            message: `${node.id} appears to represent a model invocation; use type \"llm-call\" and include model plus prompt/template details`,
            node: node.id,
            roles
          });
        } else if (childrenOf(node.id).length && hasOwnerAgentTurnSignals(node)) {
          issues.push({
            severity: "error",
            type: "owner-agent-turn-decomposed",
            message: `${node.id} appears to decompose an owner/model turn into child blocks; keep internal reasoning and bookkeeping inside the call node`,
            node: node.id,
            children: childrenOf(node.id)
          });
        }
        const key = node.parent || "__root__";
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(node);
      }
      for (const [parentId, siblings] of groups) {
        const matched = siblings
          .map((node) => ({ node, roles: llmFragmentRoles(node) }))
          .filter((item) => item.roles.length);
        const roles = new Set(matched.flatMap((item) => item.roles));
        const hasPromptOnlyNode = matched.some((item) => item.roles.includes("prompt-detail") && !isLlmCallNode(item.node));
        const hasModelInvocationNode = matched.some((item) => item.roles.includes("model-invocation") || isLlmCallNode(item.node));
        if (hasPromptOnlyNode && hasModelInvocationNode) {
          issues.push({
            severity: "error",
            type: "llm-call-overfragmented",
            message: `sibling nodes under ${parentId} appear to split prompt/template text from a model call; attach prompt/template details to the llm-call node`,
            parent: parentId,
            nodes: matched.map((item) => item.node.id),
            roles: Array.from(roles)
          });
        }
      }
      if (isAgentSkillMap()) {
        for (const [parentId, childIds] of childrenByParent) {
          const parent = nodesById.get(parentId);
          const children = childIds.map((id) => nodesById.get(id)).filter(Boolean);
          const hasLlmChild = children.some(isLlmCallNode);
          const parentIsCognitiveReview = parent && parentSuggestsCognitiveReview(parent);
          if (!hasLlmChild && !parentIsCognitiveReview) continue;
          const weakChildren = children.filter((child) => (
            isProcessDecisionOrNote(child)
            && !hasSubstantialDeterministicEvidence(child)
          ));
          if (weakChildren.length) {
            issues.push({
              severity: "error",
              type: "agent-cognitive-child-node",
              message: `${parentId} has process/decision/note child nodes that look like owner-agent cognitive work; fold review/gate/check details into descriptions unless they are substantial deterministic code/tool work`,
              parent: parentId,
              nodes: weakChildren.map((child) => child.id)
            });
          }
        }
      }
      return issues;
    }

    function auditCurrentView() {
      renderActionBadges(cy);
      const main = auditCytoscapeGraph(cy, "main");
      main.issues.push(...auditActionBadges(cy, "main"));
      main.issues.push(...auditLlmCallGranularity());
      main.issues.push(...auditColorPolicy());
      main.issues.push(...auditModalNavigation());
      main.issues.push(...auditContentSummaries());
      const visibleModals = document.querySelectorAll(".modal.visible").length;
      if (visibleModals > 1) {
        main.issues.push({
          severity: "error",
          type: "modal-depth",
          message: `more than one modal is visible: ${visibleModals}`,
          visibleModals
        });
      }
      return main;
    }

    function auditActiveSubgraph() {
      if (subgraphCy) renderActionBadges(subgraphCy);
      const result = auditCytoscapeGraph(subgraphCy, `subgraph:${subgraphState.rootId || "none"}`);
      result.issues.push(...auditActionBadges(subgraphCy, `subgraph:${subgraphState.rootId || "none"}`));
      result.issues.push(...auditModalNavigation());
      const visibleModals = document.querySelectorAll(".modal.visible").length;
      if (visibleModals > 1) {
        result.issues.push({
          severity: "error",
          type: "modal-depth",
          message: `more than one modal is visible: ${visibleModals}`,
          visibleModals
        });
      }
      return result;
    }

    window.flowchartApp = {
      counts() {
        return { nodes: cy.nodes().length, edges: cy.edges().length };
      },
      selectedId() {
        return state.selectedId;
      },
      expandableIds() {
        return (DATA.nodes || []).filter((node) => childrenOf(node.id).length).map((node) => node.id);
      },
      selectNode,
      toggleExpand,
      openSubgraph,
      focusNode,
      clearFocus,
      fit() {
        fitReadable(64);
      },
      modalCount() {
        return document.querySelectorAll(".modal.visible").length;
      },
      nodeCenterForAudit(nodeId, scope = "main") {
        const instance = scope === "subgraph" ? subgraphCy : cy;
        if (!instance) return null;
        const element = instance.getElementById(nodeId);
        if (!element.length) return null;
        const box = element.renderedBoundingBox({
          includeLabels: false,
          includeOverlays: false,
          includeUnderlays: false
        });
        const rect = instance.container().getBoundingClientRect();
        return {
          x: rect.left + (box.x1 + box.x2) / 2,
          y: rect.top + (box.y1 + box.y2) / 2
        };
      },
      audit() {
        return auditCurrentView();
      },
      auditActiveSubgraph,
      activeSubgraphBoundaryForAudit() {
        if (!subgraphCy) return { runIn: [], runOut: [] };
        return {
          runIn: subgraphCy.nodes("[boundaryRole = 'run-in']").toArray().map((node) => node.data("label")),
          runOut: subgraphCy.nodes("[boundaryRole = 'run-out']").toArray().map((node) => node.data("label"))
        };
      },
      activeSubgraphBoundaryStylesForAudit() {
        if (!subgraphCy) return [];
        return subgraphCy.nodes("[boundaryRole]").toArray().map((node) => ({
          id: node.id(),
          label: node.data("label"),
          role: node.data("boundaryRole"),
          opacity: Number.parseFloat(node.style("opacity")),
          backgroundOpacity: Number.parseFloat(node.style("background-opacity")),
          borderOpacity: Number.parseFloat(node.style("border-opacity")),
          textOpacity: Number.parseFloat(node.style("text-opacity"))
        }));
      },
      closeModal,
      data() {
        return DATA;
      },
      selectSubgraphNodeForAudit(nodeId) {
        const node = nodesById.get(nodeId);
        if (!node || !subgraphCy) return false;
        subgraphState.selectedId = nodeId;
        renderSubgraphDetail(node);
        subgraphCy.nodes().unselect();
        const element = subgraphCy.getElementById(nodeId);
        if (element.length) element.select();
        renderActionBadges(subgraphCy);
        return true;
      },
      openContentForAudit(nodeId, kind, index) {
        const node = nodesById.get(nodeId);
        if (!node) return false;
        openContent(node, kind, index);
        return true;
      },
      renderFormattedMarkdownForAudit(text) {
        return renderFormattedMarkdown(text);
      }
    };

    renderTitle();
    renderViews();
    renderViewDescription();
    renderLegend();
    renderEdgeLegend();
    rebuildGraph();
    logEvent("info", "flowchart_initialized", {
      title: DATA.title,
      nodes: (DATA.nodes || []).length,
      edges: (DATA.edges || []).length
    });
  </script>
</body>
</html>
