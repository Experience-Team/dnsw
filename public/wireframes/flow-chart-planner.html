          summary: sourceEdges.map((edge) => edge.summary || edge.label).filter(Boolean).join("; ") || `Work enters from ${validSourceIds.map(labelForNode).join(", ")}.`,
          synthetic: true,
          boundaryRole: "run-in"
        });
      }

      function addCombinedOutgoing(sourceId, targetIds, sourceEdges = []) {
        const validTargetIds = targetIds.filter((id) => nodesById.has(id));
        if (!validTargetIds.length || !childIds.has(sourceId)) return;
        const key = `${sourceId}->${validTargetIds.join("+")}`;
        if (seenOutgoing.has(key)) return;
        seenOutgoing.add(key);
        const sourcePosition = childPositions.get(sourceId) || { x: maxX, y: 0 };
        const nodeId = `__run_out_${rootId}_${sourceId}_${validTargetIds.join("_")}`.replace(/[^A-Za-z0-9_-]/g, "_");
        nodes.push({
          id: nodeId,
          label: `To ${joinedExternalLabels(validTargetIds)}`,
          type: "external",
          summary: `Work leaves this expanded graph for ${validTargetIds.map(labelForNode).join(", ")}.`,
          description: `This outside block is not part of the expanded graph. It is shown so the outgoing path is visible after the last child step.`,
          synthetic: true,
          boundaryRole: "run-out",
          position: { x: maxX + BOUNDARY_NODE_GAP, y: sourcePosition.y }
        });
        edges.push({
          id: `__run_out_edge_${rootId}_${sourceId}_${validTargetIds.join("_")}`.replace(/[^A-Za-z0-9_-]/g, "_"),
          source: sourceId,
          target: nodeId,
          type: sourceEdges[0]?.type || "flow",
          label: `run out to ${validTargetIds.map(labelForNode).join(", ")}`,
          summary: sourceEdges.map((edge) => edge.summary || edge.label).filter(Boolean).join("; ") || `Work leaves for ${validTargetIds.map(labelForNode).join(", ")}.`,
          synthetic: true,
          boundaryRole: "run-out"
        });
      }

      const rootIncoming = incomingByNode.get(rootId) || [];
      // dnsw change: likewise, an entry with its own edge from an outside block keeps only that edge.
      const explicitEntries = new Set((DATA.edges || [])
        .filter((edge) => childIds.has(edge.target) && !childIds.has(edge.source) && edge.source !== rootId)
        .map((edge) => edge.target));
      if (rootIncoming.length) {
        for (const entryId of entryIds) {
          if (!explicitEntries.has(entryId)) addCombinedIncoming(rootIncoming.map((edge) => edge.source), entryId, rootIncoming);
        }
      }
      for (const edge of (DATA.edges || [])) {
        if (childIds.has(edge.target) && !childIds.has(edge.source) && edge.source !== rootId) {
          addIncoming(edge.source, edge.target, edge);
        }
      }

      const rootOutgoing = outgoingByNode.get(rootId) || [];
      // dnsw change: an exit with its own edge to an outside block keeps only that edge, rather than also being
      // joined to every block the parent leads to (which drew one exit going everywhere).
      const explicitExits = new Set((DATA.edges || [])
        .filter((edge) => childIds.has(edge.source) && !childIds.has(edge.target) && edge.target !== rootId)
        .map((edge) => edge.source));
      if (rootOutgoing.length) {
        for (const exitId of exitIds) {
          if (!explicitExits.has(exitId)) addCombinedOutgoing(exitId, rootOutgoing.map((edge) => edge.target), rootOutgoing);
        }
      }
      for (const edge of (DATA.edges || [])) {
        if (childIds.has(edge.source) && !childIds.has(edge.target) && edge.target !== rootId) {
          addOutgoing(edge.source, edge.target, edge);
        }
      }

      const incomingNodes = nodes.filter((node) => node.boundaryRole === "run-in");
      const outgoingNodes = nodes.filter((node) => node.boundaryRole === "run-out");
      for (const group of [incomingNodes, outgoingNodes]) {
        const groupsByX = new Map();
        for (const node of group) {
          const key = String(node.position.x);
          if (!groupsByX.has(key)) groupsByX.set(key, []);
          groupsByX.get(key).push(node);
        }
        for (const siblings of groupsByX.values()) {
          if (siblings.length <= 1) continue;
          siblings.sort((first, second) => first.position.y - second.position.y || first.id.localeCompare(second.id));
          const offsets = centeredOffsets(siblings.length, NODE_SIZE_DEFAULT.height + 42);
          const centerY = average(siblings.map((node) => node.position.y), 0);
          siblings.forEach((node, index) => {
            node.position.y = centerY + offsets[index];
          });
        }
      }

      return { nodes, edges };
    }

    function buildElements(sourceNodes = null, options = {}) {
      syntheticNodesById.clear();
      const sourceVisibleNodes = sourceNodes || visibleNodeList();
      const boundary = options.boundaryRootId ? subgraphBoundaryModel(options.boundaryRootId, sourceVisibleNodes) : { nodes: [], edges: [] };
      for (const node of boundary.nodes) syntheticNodesById.set(node.id, node);
      const visibleNodes = [...sourceVisibleNodes, ...boundary.nodes];
      const visibleIds = new Set(visibleNodes.map((node) => node.id));
      const positions = resolveLayoutPositions(visibleNodes);
      const edgeList = visibleEdgeListWithSynthetic(visibleIds, boundary.edges);
      const nodeElements = visibleNodes.map((node) => elementForNode(node, visibleIds, visibleNodes, positions));
      const compactCeiling = compactEdgeCeiling(visibleIds, positions, edgeList);
      const forceAllEdges = Boolean(options.forceAllEdges);
      const routes = routeVisibleEdges(edgeList, positions, compactCeiling, forceAllEdges);
      const edgeElements = edgeList
        .filter((edge) => forceAllEdges || edgeRenderableOnCanvas(edge, positions, compactCeiling))
        .map((edge) => elementForEdge(edge, visibleIds, routes.get(edgeId(edge))));
      return { elements: [...nodeElements, ...edgeElements], visibleNodes, visibleIds };
    }

    function fitReadableGraph(instance, padding = 64) {
      if (!instance || !instance.elements().length) return;
      instance.fit(instance.elements(), padding);
      if (instance.zoom() > 1) {
        instance.zoom(1);
        instance.center(instance.elements());
      }
      // dnsw change: on phones, fit the width only and start at the top, so labels stay readable; drag to move down
      if (window.innerWidth <= 700) {
        const box = instance.elements().boundingBox();
        const width = instance.width();
        const zoom = Math.min(0.6, Math.max(0.2, (width - 32) / Math.max(box.w, 1)));
        instance.zoom(zoom);
        instance.pan({ x: (width - box.w * zoom) / 2 - box.x1 * zoom, y: 48 - box.y1 * zoom });
      }
      const zoom = Math.max(instance.zoom(), 0.001);
      const nodeFontSize = Math.max(14, MIN_NODE_FONT_PIXELS / zoom);
      const edgeFontSize = Math.max(12, MIN_EDGE_FONT_PIXELS / zoom);
      instance.nodes().forEach((node) => node.data("fontSize", Number(nodeFontSize.toFixed(2))));
      instance.edges().forEach((edge) => edge.data("edgeFontSize", Number(edgeFontSize.toFixed(2))));
      window.requestAnimationFrame(() => renderActionBadges(instance));
    }

    function fitReadable(padding = 64) {
      fitReadableGraph(cy, padding);
    }

    function zoomGraph(instance, factor) {
      if (!instance || !instance.elements().length) return;
      const container = instance.container();
      const nextZoom = Math.max(instance.minZoom(), Math.min(instance.maxZoom(), instance.zoom() * factor));
      instance.zoom({
        level: nextZoom,
        renderedPosition: {
          x: container.clientWidth / 2,
          y: container.clientHeight / 2
        }
      });
      window.requestAnimationFrame(() => renderActionBadges(instance));
    }

    function attachWheelZoom(instance) {
      const container = instance.container();
      if (!container || container.dataset.flowchartWheelZoom === "true") return;
      container.dataset.flowchartWheelZoom = "true";
      container.addEventListener("wheel", (event) => {
        event.preventDefault();
        const delta = Math.max(-120, Math.min(120, event.deltaY));
        const factor = Math.exp(-delta * 0.00075);
        const nextZoom = Math.max(instance.minZoom(), Math.min(instance.maxZoom(), instance.zoom() * factor));
        instance.zoom({
          level: nextZoom,
          renderedPosition: {
            x: event.offsetX,
            y: event.offsetY
          }
        });
      }, { passive: false });
    }

    attachWheelZoom(cy);

    function overlayForInstance(instance) {
      return instance === cy
        ? document.getElementById("main-graph-overlay")
        : document.getElementById("subgraph-graph-overlay");
    }

    function renderedNodeBox(element) {
      return element.renderedBoundingBox({
        includeLabels: false,
        includeOverlays: false,
        includeUnderlays: false
      });
    }

    function renderedCenter(box) {
      return {
        x: (box.x1 + box.x2) / 2,
        y: (box.y1 + box.y2) / 2
      };
    }

    function edgeRouteSegments(edge, boxesById) {
      const sourceBox = boxesById.get(edge.source().id());
      const targetBox = boxesById.get(edge.target().id());
      if (!sourceBox || !targetBox) return [];
      const sourceCenter = renderedCenter(sourceBox);
      const targetCenter = renderedCenter(targetBox);
      const sourceOffset = Number(edge.data("sourceOffset")) || 0;
      const targetOffset = Number(edge.data("targetOffset")) || 0;
      const direction = edge.data("direction") || "right";
      const turn = Math.max(24, Number(edge.data("taxiTurn")) || EDGE_TAXI_TURN_BASE);
      const corridorCount = Math.max(1, Number(edge.data("corridorCount")) || 1);
      const corridorIndex = Math.min(corridorCount - 1, Math.max(0, Number(edge.data("corridorIndex")) || 0));

      function cleanSegments(segments) {
        return segments.filter((segment) => (
          Math.abs(segment.start.x - segment.end.x) > 0.5
          || Math.abs(segment.start.y - segment.end.y) > 0.5
        ));
      }

      function mobileDoglegOffset() {
        if (corridorCount <= 1) return 0;
        const centeredIndex = corridorIndex - (corridorCount - 1) / 2;
        const laneGap = Math.max(MIN_EDGE_WIDTH + MIN_PARALLEL_EDGE_WHITESPACE + 2, 14);
        return centeredIndex * laneGap;
      }

      function middleLane(startCoordinate, endCoordinate) {
        const span = Math.abs(endCoordinate - startCoordinate);
        const sign = endCoordinate >= startCoordinate ? 1 : -1;
        if (corridorCount > 1) {
          const minimumGap = Math.max(MIN_EDGE_WIDTH + MIN_PARALLEL_EDGE_WHITESPACE, 12);
          const minCoordinate = Math.min(startCoordinate, endCoordinate);
          const maxCoordinate = Math.max(startCoordinate, endCoordinate);
          const center = (startCoordinate + endCoordinate) / 2;
          const centeredIndex = corridorIndex - (corridorCount - 1) / 2;
          if (span >= minimumGap * corridorCount) {
            return minCoordinate + ((corridorIndex + 0.5) / corridorCount) * (maxCoordinate - minCoordinate);
          }
          return center + centeredIndex * minimumGap;
        }
        const available = Math.max(24, span - 24);
        return startCoordinate + sign * Math.min(turn, available);
      }

      if (direction === "down" || direction === "up") {
        const downward = direction === "down";
        const start = {
          x: sourceCenter.x + sourceOffset,
          y: downward ? sourceBox.y2 : sourceBox.y1
        };
        const end = {
          x: targetCenter.x + targetOffset,
          y: downward ? targetBox.y1 : targetBox.y2
        };
        const verticalSpan = Math.abs(end.y - start.y);
        const horizontalDelta = Math.abs(end.x - start.x);
        if (window.innerWidth <= 700 && verticalSpan >= 24 && horizontalDelta >= 18) {
          const laneY = (start.y + end.y) / 2 + mobileDoglegOffset();
          return cleanSegments([
            { start, end: { x: start.x, y: laneY } },
            { start: { x: start.x, y: laneY }, end: { x: end.x, y: laneY } },
            { start: { x: end.x, y: laneY }, end }
          ]);
        }
        const midY = middleLane(start.y, end.y);
        return [
          { start, end: { x: start.x, y: midY } },
          { start: { x: start.x, y: midY }, end: { x: end.x, y: midY } },
          { start: { x: end.x, y: midY }, end }
        ];
      }

      const rightward = direction !== "left";
      const start = {
        x: rightward ? sourceBox.x2 : sourceBox.x1,
        y: sourceCenter.y + sourceOffset
      };
      const end = {
        x: rightward ? targetBox.x1 : targetBox.x2,
        y: targetCenter.y + targetOffset
      };
      const horizontalSpan = Math.abs(end.x - start.x);
      const verticalDelta = Math.abs(end.y - start.y);
      if (window.innerWidth <= 700 && horizontalSpan >= 24 && verticalDelta >= 18) {
        const laneX = (start.x + end.x) / 2 + mobileDoglegOffset();
        return cleanSegments([
          { start, end: { x: laneX, y: start.y } },
          { start: { x: laneX, y: start.y }, end: { x: laneX, y: end.y } },
          { start: { x: laneX, y: end.y }, end }
        ]);
      }
      const midX = middleLane(start.x, end.x);
      return [
        { start, end: { x: midX, y: start.y } },
        { start: { x: midX, y: start.y }, end: { x: midX, y: end.y } },
        { start: { x: midX, y: end.y }, end }
      ];
    }

    // dnsw change: the last straight piece before a box is at least one arrowhead long, so the arrowhead never folds
    // into a bend. The lane between the two ends moves back from the target to make room, never past the source.
    function ensureArrowRoom(segments, minLength) {
      const count = segments.length;
      if (count < 3) return segments;
      const last = segments[count - 1];
      const turn = segments[count - 2];
      const before = segments[count - 3];
      const horizontal = Math.abs(last.end.y - last.start.y) < 0.5;
      const axis = horizontal ? "x" : "y";
      const length = Math.abs(last.end[axis] - last.start[axis]);
      if (length >= minLength) return segments;
      const origin = segments[0].start[axis];
      const direction = Math.sign(last.end[axis] - origin);
      if (!direction) return segments;
      let lane = last.end[axis] - direction * minLength;
      if ((lane - origin) * direction < 0) lane = origin;
      last.start[axis] = lane;
      turn.start[axis] = lane;
      turn.end[axis] = lane;
      before.end[axis] = lane;
      return segments;
    }

    function pathForSegments(segments) {
      if (!segments.length) return "";
      const first = segments[0].start;
      const parts = [`M ${first.x.toFixed(1)} ${first.y.toFixed(1)}`];
      for (const segment of segments) {
        parts.push(`L ${segment.end.x.toFixed(1)} ${segment.end.y.toFixed(1)}`);
      }
      return parts.join(" ");
    }

    function dashArrayForEdge(edge) {
      const style = edge.data("lineStyle") || "solid";
      if (style === "dashed") return "9 6";
      if (style === "dotted") return "2 6";
      return "";
    }

    function svgSafeId(value) {
      return String(value).replace(/[^A-Za-z0-9_-]/g, "_");
    }

    function renderEdgeOverlay(instance, overlay) {
      const container = instance.container();
      if (!container || !overlay) return;
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("class", "edge-overlay-svg");
      svg.setAttribute("width", String(container.clientWidth));
      svg.setAttribute("height", String(container.clientHeight));
      svg.setAttribute("viewBox", `0 0 ${container.clientWidth} ${container.clientHeight}`);
      const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
      svg.appendChild(defs);

      const boxesById = new Map(instance.nodes().toArray().map((node) => [node.id(), renderedNodeBox(node)]));
      instance.edges().forEach((edge, index) => {
        const highlighted = edge.hasClass("highlighted");
        const dimmed = edge.hasClass("dimmed");
        const color = highlighted ? "#ff4802" : (edge.data("color") || "#111111");
        const width = highlighted ? EDGE_WIDTH_HIGHLIGHT : (Number(edge.data("width")) || EDGE_WIDTH_DEFAULT);
        // dnsw change: the arrowhead grows with the line, so it is always clearly wider than the line it ends
        const arrowSize = Math.max(14, width * 3.2);
        const segments = ensureArrowRoom(edgeRouteSegments(edge, boxesById), arrowSize + 8);
        const pathData = pathForSegments(segments);
        if (!pathData) return;
        const markerId = `arrow_${svgSafeId(edge.id())}_${index}`;
        const marker = document.createElementNS("http://www.w3.org/2000/svg", "marker");
        marker.setAttribute("id", markerId);
        marker.setAttribute("viewBox", "0 0 10 10");
        marker.setAttribute("refX", "9");
        marker.setAttribute("refY", "5");
        marker.setAttribute("markerWidth", String(arrowSize));
        marker.setAttribute("markerHeight", String(arrowSize));
        marker.setAttribute("markerUnits", "userSpaceOnUse");
        marker.setAttribute("orient", "auto-start-reverse");
        const arrow = document.createElementNS("http://www.w3.org/2000/svg", "path");
        arrow.setAttribute("d", "M 0 0 L 10 5 L 0 10 z");
        arrow.setAttribute("fill", color);
        marker.appendChild(arrow);
        defs.appendChild(marker);

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("class", "edge-overlay-path");
        path.setAttribute("data-edge-id", edge.id());
        path.setAttribute("d", pathData);
        path.setAttribute("stroke", color);
        path.setAttribute("stroke-width", String(width));
        path.setAttribute("marker-end", `url(#${markerId})`);
        path.setAttribute("opacity", dimmed ? "0.18" : "1");
        const dash = dashArrayForEdge(edge);
        if (dash) path.setAttribute("stroke-dasharray", dash);
        svg.appendChild(path);
      });
      overlay.appendChild(svg);
    }

    function activateSubgraphNode(id) {
      const node = nodesById.get(id);
      if (!node) return;
      if (childrenOf(id).length) {
        openSubgraph(id);
        return;
      }
      if (hasOpenableContent(node)) {
        openFirstContent(node);
      }
    }

    function renderActionBadges(instance) {
      const overlay = overlayForInstance(instance);
      if (!overlay) return;
      const container = instance.container();
      overlay.innerHTML = "";
      renderEdgeOverlay(instance, overlay);
      const nodeBoxes = new Map(instance.nodes().toArray().map((element) => [
        element.id(),
        element.renderedBoundingBox({
          includeLabels: false,
          includeOverlays: false,
          includeUnderlays: false
        })
      ]));
      instance.nodes().forEach((element) => {
        const id = element.id();
        const node = nodesById.get(id) || syntheticNodesById.get(id);
        if (!node) return;
        if (node.synthetic) return;
        const hasSubgraph = childrenOf(id).length > 0;
        const hasContent = hasOpenableContent(node);
        if (!hasSubgraph && !hasContent) return;

        const box = element.renderedBoundingBox({
          includeLabels: false,
          includeOverlays: false,
          includeUnderlays: false
        });
        const actions = [
          ...(hasSubgraph ? [{ action: "subgraph", text: "+", title: "Show the steps" }] : []),
          ...(hasContent ? [{ action: "content", text: "T", title: "Open content" }] : [])
        ];

        actions.forEach((item, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `node-action-badge ${item.action}`;
          button.innerHTML = ICON[item.action] || item.text;
          button.dataset.nodeId = id;
          button.dataset.action = item.action;
          button.title = item.title;
          button.setAttribute("aria-label", `${item.title} for ${node.label || id}`);

          const baseLeft = box.x2 - BADGE_CORNER_OVERLAP - index * (BADGE_SIZE + BADGE_GAP);
          const baseLeftFallback = box.x1 - BADGE_SIZE + BADGE_CORNER_OVERLAP + index * (BADGE_SIZE + BADGE_GAP);
          const candidates = [
            { left: baseLeft, top: box.y1 - BADGE_SIZE + BADGE_CORNER_OVERLAP },
            { left: baseLeft, top: box.y1 - BADGE_SIZE - 1 },
            { left: baseLeft, top: box.y2 - BADGE_CORNER_OVERLAP },
            { left: baseLeft, top: box.y2 + 1 },
            { left: baseLeftFallback, top: box.y1 - BADGE_SIZE + BADGE_CORNER_OVERLAP },
            { left: baseLeftFallback, top: box.y1 - BADGE_SIZE - 1 },
            { left: baseLeftFallback, top: box.y2 - BADGE_CORNER_OVERLAP },
            { left: baseLeftFallback, top: box.y2 + 1 }
          ];
          function candidateRect(candidate) {
            return {
              x1: candidate.left,
              y1: candidate.top,
              x2: candidate.left + BADGE_SIZE,
              y2: candidate.top + BADGE_SIZE
            };
          }
          function candidateScore(candidate) {
            const rect = candidateRect(candidate);
            let score = 0;
            if (
              !container
              || rect.x1 < 0
              || rect.y1 < 0
              || rect.x2 > container.clientWidth
              || rect.y2 > container.clientHeight
            ) {
              score += 100000;
            }
            for (const [nodeId, nodeBox] of nodeBoxes) {
              if (nodeId === id) continue;
              score += rectIntersectionArea(rect, inflatedRect(nodeBox, 1));
            }
            return score;
          }
          const chosen = [...candidates].sort((first, second) => candidateScore(first) - candidateScore(second))[0];
          const left = chosen.left;
          const top = chosen.top;
          button.style.left = `${Math.round(left)}px`;
          button.style.top = `${Math.round(top)}px`;
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            if (item.action === "subgraph") {
              openSubgraph(id);
              return;
            }
            if (item.action === "content") {
              openFirstContent(node);
            }
          });
          overlay.appendChild(button);
        });
      });
    }

    function textForSearch(node) {
      const parts = [
        node.label,
        node.type,
        node.summary,
        node.description,
        ...(node.badges || []),
        ...(node.prompts || []).flatMap((item) => [item.label, item.language, item.content]),
        ...(node.artifacts || []).flatMap((item) => [item.label, item.path, item.language, item.content]),
        ...(node.evidence || []).flatMap((item) => [item.label, item.path, item.lines])
      ];
      return parts.filter(Boolean).join(" ").toLowerCase();
    }

    function applyHighlights() {
      cy.elements().removeClass("highlighted matched dimmed");

      const view = activeView();
      const highlights = new Set([...(view?.highlightNodeIds || [])]);
      if (state.selectedId) {
        highlights.add(state.selectedId);
        cy.getElementById(state.selectedId).connectedEdges().forEach((edge) => {
          highlights.add(edge.source().id());
          highlights.add(edge.target().id());
          edge.addClass("highlighted");
        });
      }

      for (const id of highlights) {
        const element = cy.getElementById(id);
        if (element.length) element.addClass("highlighted");
      }

      const query = state.search.trim().toLowerCase();
      if (query) {
        const matchedIds = [];
        for (const node of DATA.nodes || []) {
          if (textForSearch(node).includes(query)) {
            const element = cy.getElementById(node.id);
            if (element.length) {
              element.addClass("matched");
              matchedIds.push(node.id);
            }
          }
        }
        if (matchedIds.length) {
          cy.elements().not(".matched").addClass("dimmed");
          cy.edges().forEach((edge) => {
            if (edge.source().hasClass("matched") || edge.target().hasClass("matched")) {
              edge.removeClass("dimmed").addClass("highlighted");
              edge.source().removeClass("dimmed");
              edge.target().removeClass("dimmed");
            }
          });
        }
      }
    }

    function rebuildGraph(options = {}) {
      const { fit = true } = options;
      const { elements, visibleNodes, visibleIds } = buildElements();
      cy.batch(() => {
        cy.elements().remove();
        cy.add(elements);
        cy.layout({ name: "preset", fit: false }).run();
      });
      if (state.selectedId && !visibleIds.has(state.selectedId)) {
        state.selectedId = null;
      }
      if (state.selectedId) {
        cy.getElementById(state.selectedId).select();
      }
      applyHighlights();
      renderInspector();
      renderStats(visibleNodes, cy.edges().length);
      renderFocusPill();
      if (fit && cy.elements().length) {
        window.requestAnimationFrame(() => fitReadable(64));
      } else {
        window.requestAnimationFrame(() => renderActionBadges(cy));
      }
      logEvent("info", "graph_rendered", {
        visibleNodes: visibleNodes.length,
        visibleEdges: cy.edges().length,
        activeView: state.activeView
      });
    }

    function renderTitle() {
      document.getElementById("chart-title").textContent = DATA.title || "Flowchart";
      document.title = DATA.title || "Flowchart";
      const subtitle = document.getElementById("chart-subtitle");
      subtitle.textContent = DATA.subtitle || "";
      subtitle.style.display = DATA.subtitle ? "block" : "none";
    }

    function renderViews() {
      const tabs = document.getElementById("view-tabs");
      const views = DATA.views || [];
      tabs.innerHTML = "";
      tabs.style.display = views.length ? "flex" : "none";
      for (const view of views) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = view.label || view.id;
        button.className = view.id === state.activeView ? "active" : "";
        button.setAttribute("aria-pressed", String(view.id === state.activeView));
        button.addEventListener("click", () => {
          state.activeView = view.id;
          renderViews();
          renderViewDescription();
          rebuildGraph();
        });
        tabs.appendChild(button);
      }
      applyViewPlaceholder();
    }

    // dnsw change: show a placeholder view's text over the chart area
    function applyViewPlaceholder() {
      const box = document.getElementById("view-placeholder");
      if (!box) return;
      const view = activeView() || {};
      const frame = view.frame || "";
      const text = view.placeholder || "";
      box.classList.toggle("is-frame", Boolean(frame));
      if (frame) {
        const current = box.querySelector("iframe");
        if (!current || current.getAttribute("src") !== frame) {
          box.textContent = "";
          const iframe = document.createElement("iframe");
          iframe.src = frame;
          iframe.title = view.label || "View";
          box.appendChild(iframe);
        }
      } else {
        box.textContent = text;
      }
      box.hidden = !(frame || text);
      const shell = box.closest(".graph-shell");
      if (shell) shell.classList.toggle("is-placeholder", Boolean(frame || text));
      const workspace = document.querySelector(".workspace");
      if (workspace) workspace.classList.toggle("is-frame-view", Boolean(frame));
      window.requestAnimationFrame(() => window.dispatchEvent(new Event("resize")));
    }

    function renderViewDescription() {
      const view = activeView();
      document.getElementById("view-description").textContent =
        view?.description || DATA.metadata?.purpose || "Overview";
    }

    function renderLegend() {
      const section = document.getElementById("legend-section");
      const legend = document.getElementById("legend");
      legend.innerHTML = "";
      if (!useColorGroups) {
        section.style.display = "none";
        return;
      }
      section.style.display = "block";
      for (const key of colorGroupKeys) {
        const color = groupColors.get(key) || NEUTRAL_NODE_COLOR;
        const item = document.createElement("div");
        item.className = "legend-item";
        item.innerHTML = `<span class="swatch" style="background:${escapeHtml(color)}"></span><span>${escapeHtml(colorGroupLabel(key))}</span>`;
        legend.appendChild(item);
      }
    }

    function renderEdgeLegend() {
      const section = document.getElementById("edge-legend-section");
      const legend = document.getElementById("edge-legend");
      if (!section || !legend) return;
      legend.innerHTML = "";
      if (!edgeKeys.length) {
        section.style.display = "none";
        return;
      }
      section.style.display = "block";
      for (const key of edgeKeys) {
        const meta = edgeMeta(key);
        const color = meta.color || edgeColors.get(key) || "#111111";
        const style = meta.lineStyle || "solid";
        const item = document.createElement("div");
        item.className = "edge-legend-item";
        item.innerHTML = `<span class="edge-line" style="--el-color:${escapeHtml(color)};--el-style:${escapeHtml(style)}"></span><span class="edge-legend-text"><span class="name">${escapeHtml(meta.label || key)}</span><span class="meta">${escapeHtml(style)}</span></span>`;
        legend.appendChild(item);
      }
    }

    function renderStats(visibleNodes, renderedEdgeCount = null) {
      const stats = document.getElementById("stats");
      const visibleIds = new Set(visibleNodes.map((node) => node.id));
      const visibleEdges = (DATA.edges || []).filter((edge) => visibleIds.has(edge.source) && visibleIds.has(edge.target));
      const hiddenNodes = Math.max(0, (DATA.nodes || []).length - visibleNodes.length);
      const hiddenEdges = renderedEdgeCount === null ? 0 : Math.max(0, visibleEdges.length - renderedEdgeCount);
      stats.innerHTML = `
        <span>Boxes</span><strong>${visibleNodes.length}</strong>
        <span>Arrows</span><strong>${renderedEdgeCount === null ? visibleEdges.length : renderedEdgeCount}</strong>
        ${hiddenNodes ? `<span>Steps inside</span><strong>${hiddenNodes}</strong>` : ""}
      `;
    }

    function renderFocusPill() {
      const pill = document.getElementById("focus-pill");
      pill.classList.remove("visible");
    }

    function badgeHtml(items) {
      if (!items || !items.length) return "";
      return `<div class="badge-row">${items.map((item) => `<span class="badge">${escapeHtml(item)}</span>`).join("")}</div>`;
    }

    function renderEvidence(items) {
      if (!items || !items.length) return "";
      return `
        <section class="section">
          <h2>Evidence</h2>
          <ul class="detail-list">
            ${items.map((item) => `
              <li>
                <strong>${escapeHtml(item.label || item.path || "Evidence")}</strong>
                ${item.path ? `<code>${escapeHtml(item.path)}${item.lines ? `:${escapeHtml(item.lines)}` : ""}</code>` : ""}
                ${item.note ? `<span>${escapeHtml(item.note)}</span>` : ""}
              </li>
            `).join("")}
          </ul>
        </section>
      `;
    }

    function renderContentItems(title, items, kind) {
      if (!items || !items.length) return "";
      return `
        <section class="section">
          <h2>${escapeHtml(title)}</h2>
          <ul class="detail-list">
            ${items.map((item, index) => `
              <li>
                <strong>${escapeHtml(item.label || item.path || `${kind} ${index + 1}`)}</strong>
                ${item.path ? `<code>${escapeHtml(item.path)}</code>` : ""}
                ${item.summary ? `<span>${escapeHtml(item.summary)}</span>` : ""}
                ${(item.content || item.excerpt) ? `<button class="text-button icon-button" data-kind="${escapeHtml(kind)}" data-index="${index}" type="button" aria-label="Open ${escapeHtml(item.label || item.path || kind)}" title="Open">${kind === "prompts" ? ICON.prompt : ICON.artifact}</button>` : ""}
              </li>
            `).join("")}
          </ul>
        </section>
      `;
    }

    function detailValueHtml(value) {
      if (value === undefined || value === null || value === "") return "";
      if (Array.isArray(value)) {
        return value.map((item) => escapeHtml(typeof item === "string" ? item : JSON.stringify(item))).join(", ");
      }
      if (typeof value === "object") {
        return `<code>${escapeHtml(JSON.stringify(value))}</code>`;
      }
      return escapeHtml(String(value));
    }

    function renderLlmCallDetails(node) {
      const isLlmCall = (node.type || "").toLowerCase() === "llm-call";
      if (!isLlmCall && !node.model && !node.modelSelection && !node.tools) return "";
      const rows = [
        ["Model", node.model],
        ["Model Selection", node.modelSelection],
        ["Tools", node.tools]
      ].filter(([, value]) => detailValueHtml(value));
      if (!rows.length) return "";
      return `
        <section class="section">
          <h2>LLM Call</h2>
          <ul class="detail-list">
            ${rows.map(([label, value]) => `
              <li>
                <strong>${escapeHtml(label)}</strong>
                <span>${detailValueHtml(value)}</span>
              </li>
            `).join("")}
          </ul>
        </section>
      `;
    }

    function edgeCaption(edge) {
      return edge.summary || edge.label || edge.type || "continues";
    }

    function labelsForIds(ids) {
      return ids.map(labelForNode).filter(Boolean).join(", ");
    }

    function childIdSet(rootId) {
      return new Set(childNodes(rootId).map((node) => node.id));
    }

    function subgraphInternalEdges(rootId) {
      const ids = childIdSet(rootId);
      return (DATA.edges || []).filter((edge) => ids.has(edge.source) && ids.has(edge.target));
    }

    function subgraphEntryIds(rootId) {
      const ids = childIdSet(rootId);
      const internal = subgraphInternalEdges(rootId);
      return Array.from(ids).filter((id) => !internal.some((edge) => edge.target === id));
    }

    function subgraphExitIds(rootId) {
      const ids = childIdSet(rootId);
      const internal = subgraphInternalEdges(rootId);
      return Array.from(ids).filter((id) => !internal.some((edge) => edge.source === id));
    }

    function externalSourceIds(rootId) {
      const ids = childIdSet(rootId);
      const sources = [
        ...(incomingByNode.get(rootId) || []).map((edge) => edge.source),
        ...(DATA.edges || [])
          .filter((edge) => ids.has(edge.target) && !ids.has(edge.source) && edge.source !== rootId)
          .map((edge) => edge.source)
      ];
      return Array.from(new Set(sources)).filter((id) => nodesById.has(id));
    }

    function externalTargetIds(rootId) {
      const ids = childIdSet(rootId);
      const targets = [
        ...(outgoingByNode.get(rootId) || []).map((edge) => edge.target),
        ...(DATA.edges || [])
          .filter((edge) => ids.has(edge.source) && !ids.has(edge.target) && edge.target !== rootId)
          .map((edge) => edge.target)
      ];
      return Array.from(new Set(targets)).filter((id) => nodesById.has(id));
    }

    function branchIds(rootId) {
      const internal = subgraphInternalEdges(rootId);
      const counts = new Map();
      for (const edge of internal) counts.set(edge.source, (counts.get(edge.source) || 0) + 1);
      return Array.from(counts).filter(([, count]) => count > 1).map(([id]) => id);
    }

    function joinIds(rootId) {
      const internal = subgraphInternalEdges(rootId);
      const counts = new Map();
      for (const edge of internal) counts.set(edge.target, (counts.get(edge.target) || 0) + 1);
      return Array.from(counts).filter(([, count]) => count > 1).map(([id]) => id);
    }

    function renderFlowRows(rows) {
      const visibleRows = rows.filter((row) => row && row.value);
      if (!visibleRows.length) return "";
      return `
        <ul class="detail-list flow-list">
          ${visibleRows.map((row) => `
            <li>
              <strong>${escapeHtml(row.label)}</strong>
              <span>${escapeHtml(row.value)}</span>
            </li>
          `).join("")}
        </ul>
      `;
    }

    function renderSubgraphBoundary(rootId) {
      const entryText = labelsForIds(subgraphEntryIds(rootId));
      const exitText = labelsForIds(subgraphExitIds(rootId));
      const sourceText = labelsForIds(externalSourceIds(rootId));
      const targetText = labelsForIds(externalTargetIds(rootId));
      const rows = [
        { label: "Comes from", value: sourceText && entryText ? `${sourceText} → ${entryText}` : sourceText || entryText },
        { label: "Branches at", value: labelsForIds(branchIds(rootId)) },
        { label: "Joins at", value: labelsForIds(joinIds(rootId)) },
        { label: "Goes to", value: targetText && exitText ? `${exitText} → ${targetText}` : targetText || exitText }
      ];
      const html = renderFlowRows(rows);
      if (!html) return "";
      return `<section class="section"><h2>How it connects</h2>${html}</section>`;
    }

    function renderSubgraphEdgeNotes(rootId) {
      const internal = subgraphInternalEdges(rootId);
      if (!internal.length) return "";
      const rows = internal.map((edge) => ({
        label: `${labelForNode(edge.source)} → ${labelForNode(edge.target)}`,
        value: edgeCaption(edge)
      }));
      return `<section class="section"><h2>Flow notes</h2>${renderFlowRows(rows)}</section>`;
    }

    function boundaryRowsForNode(node, rootId) {
      const ids = childIdSet(rootId);
      const entries = new Set(subgraphEntryIds(rootId));
      const exits = new Set(subgraphExitIds(rootId));
      const rows = [];
      if (entries.has(node.id)) {
        for (const edge of (incomingByNode.get(rootId) || [])) {
          rows.push({ label: `From ${labelForNode(edge.source)}`, value: edgeCaption(edge) });
        }
        for (const edge of (incomingByNode.get(node.id) || []).filter((item) => !ids.has(item.source) && item.source !== rootId)) {
          rows.push({ label: `From ${labelForNode(edge.source)}`, value: edgeCaption(edge) });
        }
      }
      if (exits.has(node.id)) {
        for (const edge of (outgoingByNode.get(rootId) || [])) {
          rows.push({ label: `To ${labelForNode(edge.target)}`, value: edgeCaption(edge) });
        }
        for (const edge of (outgoingByNode.get(node.id) || []).filter((item) => !ids.has(item.target) && item.target !== rootId)) {
          rows.push({ label: `To ${labelForNode(edge.target)}`, value: edgeCaption(edge) });
        }
      }
      return rows;
    }

    function renderNodeFlowNotes(node, rootId) {
      if (!rootId || !node) return "";
      const internal = subgraphInternalEdges(rootId);
      const rows = [
        ...boundaryRowsForNode(node, rootId),
        ...internal
          .filter((edge) => edge.target === node.id)
          .map((edge) => ({ label: `From ${labelForNode(edge.source)}`, value: edgeCaption(edge) })),
        ...internal
          .filter((edge) => edge.source === node.id)
          .map((edge) => ({ label: `To ${labelForNode(edge.target)}`, value: edgeCaption(edge) }))
      ];
      const html = renderFlowRows(rows);
      return html ? `<section class="section"><h2>Flow notes</h2>${html}</section>` : "";
    }

    function renderInspector() {
      const inspector = document.getElementById("inspector");
      const node = state.selectedId ? nodesById.get(state.selectedId) : null;
      if (!node) {
        inspector.innerHTML = '<div class="inspector-empty">Select a box to read what it does.</div>';
        return;
      }

      const childCount = childrenOf(node.id).length;
      const meta = typeMeta(node.type || "process");
      inspector.innerHTML = `
        <section class="section">
          <h2>Selected</h2>
          <h3 class="node-title">${escapeHtml(node.label)}</h3>
          <div class="node-type">${escapeHtml(meta.label || node.type || "Node")}${node.lane ? ` / ${escapeHtml(node.lane)}` : ""}</div>
          ${badgeHtml(node.badges || [])}
          <div class="action-row">
            ${childCount ? `<button id="toggle-node-button" type="button">Show the ${childCount} steps</button>` : ""}
            <button id="focus-node-button" type="button">Center</button>
          </div>
        </section>
        <section class="section">
          <h2>Summary</h2>
          <p>${escapeHtml(node.summary || "No summary provided.")}</p>
        </section>
        ${node.description ? `<section class="section"><h2>Detail</h2><p>${escapeHtml(node.description)}</p></section>` : ""}
        ${renderLlmCallDetails(node)}
        ${renderContentItems("Prompts And Templates", node.prompts, "prompts")}
        ${renderContentItems("Artifacts", node.artifacts, "artifacts")}
        ${renderEvidence(node.evidence)}
      `;

      const toggleButton = document.getElementById("toggle-node-button");
      if (toggleButton) {
        toggleButton.addEventListener("click", () => toggleExpand(node.id));
      }
      document.getElementById("focus-node-button").addEventListener("click", () => focusNode(node.id));

      for (const button of inspector.querySelectorAll("[data-kind][data-index]")) {
        button.addEventListener("click", () => {
          const kind = button.getAttribute("data-kind");
          const index = Number(button.getAttribute("data-index"));
          openContent(node, kind, index);
        });
      }
    }

    function toggleExpand(id) {
      if (!childrenOf(id).length) return;
      state.selectedId = id;
      renderInspector();
      openSubgraph(id);
      logEvent("info", "node_expand_opened", { nodeId: id, childCount: childrenOf(id).length });
    }

    function focusNode(id) {
      state.selectedId = id;
      const element = cy.getElementById(id);
      if (element.length) {
        cy.animate({
          center: { eles: element },
          zoom: Math.max(cy.zoom(), 1)
        }, { duration: 160 });
      }
      renderInspector();
      applyHighlights();
      logEvent("info", "node_centered", { nodeId: id });
    }

    function clearFocus() {
      fitReadable(64);
    }

    function selectNode(id) {
      state.selectedId = id;
      renderInspector();
      applyHighlights();
      logEvent("info", "node_selected", { nodeId: id });
    }

    function openFirstContent(node) {
      const promptIndex = (node.prompts || []).findIndex((item) => item.content || item.excerpt);
      if (promptIndex >= 0) {
        openContent(node, "prompts", promptIndex);
        return true;
      }
      const artifactIndex = (node.artifacts || []).findIndex((item) => item.content || item.excerpt);
      if (artifactIndex >= 0) {
        openContent(node, "artifacts", artifactIndex);
        return true;
      }
      return false;
    }

    function activateNode(id) {
      const node = nodesById.get(id);
      if (!node) return;
      selectNode(id);
    }

    function showOnlyModal(id) {
      for (const modal of document.querySelectorAll(".modal.visible")) {
        modal.classList.remove("visible");
      }
      document.getElementById(id).classList.add("visible");
    }

    function closeAnyModal() {
      for (const modal of document.querySelectorAll(".modal.visible")) {
        modal.classList.remove("visible");
      }
    }

    function childNodes(rootId) {
      return childrenOf(rootId)
        .map((id) => nodesById.get(id))
        .filter(Boolean);
    }

    function ensureSubgraphCy() {
      if (subgraphCy) return subgraphCy;
      subgraphCy = cytoscape({
        container: document.getElementById("subgraph-cy"),
        elements: [],
        minZoom: 0.2,
        maxZoom: 2.4,
        userZoomingEnabled: false,
        style: cy.style().json()
      });
      attachWheelZoom(subgraphCy);
      subgraphCy.on("tap", "node", (event) => {
        const id = event.target.id();
        const node = nodesById.get(id) || syntheticNodesById.get(id);
        subgraphState.selectedId = id;
        renderSubgraphDetail(node);
        subgraphCy.nodes().unselect();
        event.target.select();
        logEvent("info", "subgraph_node_selected", { nodeId: id, rootId: subgraphState.rootId });
      });
      subgraphCy.on("pan zoom", () => renderActionBadges(subgraphCy));
      return subgraphCy;
    }

    function renderSubgraphDetail(node = null) {
      const detail = document.getElementById("subgraph-detail");
      const root = nodesById.get(subgraphState.rootId);
      if (!node) {
        detail.innerHTML = `
          <section class="section">
            <h2>Stage</h2>
            <h3 class="node-title">${escapeHtml(root?.label || "Steps")}</h3>
            <p>${escapeHtml(root?.summary || "Select a node in the expanded graph for detail.")}</p>
          </section>
          ${renderSubgraphBoundary(subgraphState.rootId)}
          ${renderSubgraphEdgeNotes(subgraphState.rootId)}
        `;
        return;
      }

      const childCount = childrenOf(node.id).length;
      const meta = typeMeta(node.type || "process");
      detail.innerHTML = `
        <section class="section">
          <h2>Selected</h2>
          <h3 class="node-title">${escapeHtml(node.label)}</h3>
          <div class="node-type">${escapeHtml(meta.label || node.type || "Node")}${node.lane ? ` / ${escapeHtml(node.lane)}` : ""}</div>
          ${badgeHtml(node.badges || [])}
          ${childCount ? `<div class="action-row"><button id="subgraph-expand-button" type="button">Show the ${childCount} steps</button></div>` : ""}
        </section>
        <section class="section">
          <h2>Summary</h2>
          <p>${escapeHtml(node.summary || "No summary provided.")}</p>
        </section>
        ${node.description ? `<section class="section"><h2>Detail</h2><p>${escapeHtml(node.description)}</p></section>` : ""}
        ${renderNodeFlowNotes(node, subgraphState.rootId)}
        ${renderLlmCallDetails(node)}
        ${renderContentItems("Prompts And Templates", node.prompts, "prompts")}
        ${renderContentItems("Artifacts", node.artifacts, "artifacts")}
        ${renderEvidence(node.evidence)}
      `;

      const expandButton = document.getElementById("subgraph-expand-button");
      if (expandButton) {
        expandButton.addEventListener("click", () => openSubgraph(node.id));
      }
      for (const button of detail.querySelectorAll("[data-kind][data-index]")) {
        button.addEventListener("click", () => {
          const kind = button.getAttribute("data-kind");
          const index = Number(button.getAttribute("data-index"));
          openContent(node, kind, index);
        });
      }
    }

    function openSubgraph(rootId) {
      const root = nodesById.get(rootId);
      const children = childNodes(rootId);
      if (!root || !children.length) return;

      showOnlyModal("subgraph-modal");
      subgraphState.rootId = rootId;
      subgraphState.selectedId = null;
      document.getElementById("subgraph-title").textContent = `${root.label}: ${children.length} steps`;

      const instance = ensureSubgraphCy();
      const { elements, visibleNodes } = buildElements(children, { boundaryRootId: rootId, forceAllEdges: window.innerWidth > 700 });
      instance.batch(() => {
        instance.elements().remove();
        instance.add(elements);
        instance.layout({ name: "preset", fit: false }).run();
      });
      renderSubgraphDetail();
      window.requestAnimationFrame(() => {
        instance.resize();
        fitReadableGraph(instance, 64);
        renderActionBadges(instance);
      });
      logEvent("info", "subgraph_rendered", {
        rootId,
        visibleNodes: visibleNodes.length,
        visibleEdges: instance.edges().length
      });
    }

    function normalizeLanguage(language) {
      const value = String(language || "markdown").toLowerCase();
      const aliases = {
        sh: "bash",
        shell: "bash",
        py: "python",
        js: "javascript",
        ts: "typescript",
        yml: "yaml",
        md: "markdown",
        j2: "jinja2"
      };
      return aliases[value] || value;
    }

    function renderTemplateTokens(value) {
      return value.replace(/(\{\{[^}]+\}\}|\{%[^%]+%\}|\$\{[^}]+\}|\[[^\]\n]{2,120}\]|&lt;\/?[A-Z_][A-Z0-9_:-]*&gt;)/g, '<span class="template-token">$1</span>');
    }

    function renderInlineMarkdown(value) {
      const escaped = escapeHtml(value)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "$1")
        .replace(/\*([^*]+)\*/g, "$1");
      return renderTemplateTokens(escaped);
    }

    function splitMarkdownTableRow(line) {
      const trimmed = String(line || "").trim();
      if (!trimmed.includes("|")) return [];
      const body = trimmed.replace(/^\|/, "").replace(/\|$/, "");
      const cells = [];
      let current = "";
      let escaped = false;
      for (const character of body) {
        if (character === "\\" && !escaped) {
          escaped = true;
          current += character;
          continue;
        }
        if (character === "|" && !escaped) {
          cells.push(current.replace(/\\\|/g, "|").trim());
          current = "";
          continue;
        }
        escaped = false;
        current += character;
      }
      cells.push(current.replace(/\\\|/g, "|").trim());
      return cells;
    }

    function isMarkdownTableRow(line) {
      return splitMarkdownTableRow(line).length >= 2;
    }

    function isMarkdownTableSeparator(line) {
      const cells = splitMarkdownTableRow(line);
      return cells.length >= 2 && cells.every((cell) => /^:?-{3,}:?$/.test(cell.trim()));
    }

    function markdownTableAlignment(separatorCell) {
      const cell = String(separatorCell || "").trim();
      if (cell.startsWith(":") && cell.endsWith(":")) return "center";
      if (cell.endsWith(":")) return "right";
      if (cell.startsWith(":")) return "left";
      return "";
    }

    function renderMarkdownTable(headers, separatorCells, rows) {
      const alignments = separatorCells.map(markdownTableAlignment);
      const columnCount = Math.max(headers.length, ...rows.map((row) => row.length));
      const normalizedHeaders = Array.from({ length: columnCount }, (_, index) => headers[index] || "");
      const alignAttribute = (index) => {
        const alignment = alignments[index];
        return alignment ? ` style="text-align: ${alignment}"` : "";
      };
      const headerHtml = normalizedHeaders
        .map((cell, index) => `<th${alignAttribute(index)}>${renderInlineMarkdown(cell)}</th>`)
        .join("");
      const rowHtml = rows.map((row) => {
        const cells = Array.from({ length: columnCount }, (_, index) => row[index] || "");
        return `<tr>${cells.map((cell, index) => `<td${alignAttribute(index)}>${renderInlineMarkdown(cell)}</td>`).join("")}</tr>`;
      }).join("");
      return `<div class="table-wrap"><table><thead><tr>${headerHtml}</tr></thead><tbody>${rowHtml}</tbody></table></div>`;
    }

    function plainTextForSummary(text) {
      return String(text || "")
        .replace(/```[\s\S]*?```/g, " ")
        .replace(/^\s{0,3}#{1,6}\s+/gm, "")
        .replace(/^\s*[-*]\s+/gm, "")
        .replace(/\|/g, " ")
        .replace(/[`*_{}[\]<>]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function fallbackContentSummary(node, item, text) {
      const label = item.label || item.path || node.label || "This text";
      const plain = plainTextForSummary(text);
      if (!plain) return `${label} is available in the viewer.`;
      const firstSentence = plain.match(/^(.{20,180}?[.!?])\s/) || plain.match(/^(.{20,180})(?:\s|$)/);
      const excerpt = firstSentence ? firstSentence[1].trim() : plain.slice(0, 180).trim();
      return `${label}: ${excerpt}${/[.!?]$/.test(excerpt) ? "" : "."}`;
    }

    function contentItemSummary(node, item, text) {
      const explicit = item.summary || item.description;
      if (explicit && String(explicit).trim()) return String(explicit).trim();
      return fallbackContentSummary(node, item, text);
    }

    function renderFormattedMarkdown(text) {
      const lines = String(text || "").replace(/\r\n/g, "\n").split("\n");
      const blocks = [];
      let paragraph = [];
      let list = [];
      let inCode = false;
      let codeLanguage = "";
      let codeLines = [];

      function flushParagraph() {
        if (!paragraph.length) return;
        blocks.push(`<p>${renderInlineMarkdown(paragraph.join(" "))}</p>`);
        paragraph = [];
      }

      function flushList() {
        if (!list.length) return;
        blocks.push(`<ul>${list.map((item) => `<li>${renderInlineMarkdown(item)}</li>`).join("")}</ul>`);
        list = [];
      }

      function flushCode() {
        if (!codeLines.length && !inCode) return;
        const language = normalizeLanguage(codeLanguage || "text");
        const escaped = renderTemplateTokens(escapeHtml(codeLines.join("\n")));
        blocks.push(`<pre><code class="language-${escapeHtml(language)}">${escaped}</code></pre>`);
        codeLanguage = "";
        codeLines = [];
      }

      for (let index = 0; index < lines.length; index += 1) {
        const line = lines[index];
        const fence = line.match(/^```([A-Za-z0-9_-]+)?\s*$/);
        if (fence) {
          if (inCode) {
            inCode = false;
            flushCode();
          } else {
            flushParagraph();
            flushList();
            inCode = true;
            codeLanguage = fence[1] || "";
          }
          continue;
        }

        if (inCode) {
          codeLines.push(line);
          continue;
        }

        if (!line.trim()) {
          flushParagraph();
          flushList();
          continue;
        }

        if (isMarkdownTableRow(line) && isMarkdownTableSeparator(lines[index + 1] || "")) {
          flushParagraph();
          flushList();
          const headers = splitMarkdownTableRow(line);
          const separatorCells = splitMarkdownTableRow(lines[index + 1]);
          const rows = [];
          index += 2;
          while (index < lines.length && lines[index].trim() && isMarkdownTableRow(lines[index])) {
            rows.push(splitMarkdownTableRow(lines[index]));
            index += 1;
          }
          index -= 1;
          blocks.push(renderMarkdownTable(headers, separatorCells, rows));
          continue;
        }

        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          flushParagraph();
          flushList();
          const level = heading[1].length;
          blocks.push(`<h${level}>${renderInlineMarkdown(heading[2])}</h${level}>`);
          continue;
        }

        const bullet = line.match(/^\s*[-*]\s+(.+)$/);
        if (bullet) {
          flushParagraph();
          list.push(bullet[1]);
          continue;
        }

        const continuation = line.match(/^\s{2,}(.+)$/);
        if (continuation && list.length) {
          list[list.length - 1] = `${list[list.length - 1]} ${continuation[1].trim()}`;
          continue;
        }

        paragraph.push(line.trim());
      }

      if (inCode) flushCode();
      flushParagraph();
      flushList();
      return blocks.join("\n") || "<p>No content provided.</p>";
    }

    function pathFromEvidence(node) {
      const evidence = (node.evidence || []).find((item) => item.path);
      return evidence ? evidence.path : "";
    }

    function sourcePathForItem(node, item) {
      return item.sourcePath || item.path || pathFromEvidence(node);
    }

    function sourceHref(sourcePath) {
      if (!sourcePath) return "";
      if (/^[a-z]+:\/\//i.test(sourcePath)) return sourcePath;
      if (sourcePath.startsWith("/")) return `file://${sourcePath}`;
      const root = DATA.metadata && DATA.metadata.sourceRoot;
      if (root && root.startsWith("/")) {
        return `file://${root.replace(/\/$/, "")}/${sourcePath.replace(/^\//, "")}`;
      }
      return sourcePath;
    }

    function setContentMode(mode) {
      contentState.mode = mode;
      const formatted = document.getElementById("formatted-content");
      const plain = document.getElementById("plain-content");
      const formattedButton = document.getElementById("formatted-content-button");
      const plainButton = document.getElementById("plain-content-button");
      formatted.classList.toggle("hidden", mode !== "formatted");
      plain.classList.toggle("hidden", mode !== "plain");
      formattedButton.classList.toggle("active", mode === "formatted");
      plainButton.classList.toggle("active", mode === "plain");
    }

    function openContent(node, kind, index) {
      const collection = node[kind] || [];
      const item = collection[index];
      if (!item) return;
      const fromSubgraph = document.getElementById("subgraph-modal").classList.contains("visible");
      contentState.returnSubgraph = fromSubgraph
        ? { rootId: subgraphState.rootId, selectedId: subgraphState.selectedId || node.id }
        : null;
      const code = document.getElementById("modal-code");
      const formatted = document.getElementById("formatted-content");
      const title = document.getElementById("modal-title");
      const language = normalizeLanguage(item.language);
      const text = item.content || item.excerpt || "";
      const sourcePath = sourcePathForItem(node, item);
      const source = document.getElementById("content-source-link");
      title.textContent = `${node.label} / ${item.label || item.path || kind}`;
      code.className = `language-${language}`;
      code.textContent = text;
      document.getElementById("content-summary-text").textContent = contentItemSummary(node, item, text);
      formatted.innerHTML = renderFormattedMarkdown(text);
      if (sourcePath) {
        source.textContent = `Source: ${sourcePath}`;
        source.href = sourceHref(sourcePath);
        source.style.display = "block";
      } else {
        source.textContent = "";
        source.removeAttribute("href");
        source.style.display = "none";
      }
      document.getElementById("copy-status").textContent = "";
      renderContentNavigation();
      showOnlyModal("content-modal");
      setContentMode("formatted");
      Prism.highlightElement(code);
      logEvent("info", "content_opened", { nodeId: node.id, kind, index, language });
    }

    function renderContentNavigation() {
      const backButton = document.getElementById("back-content-button");
      const hasReturn = Boolean(contentState.returnSubgraph && contentState.returnSubgraph.rootId);
      backButton.classList.toggle("hidden", !hasReturn);
    }

    function restoreContentSource() {
      const target = contentState.returnSubgraph;
      if (!target || !target.rootId) return false;
      contentState.returnSubgraph = null;
      showOnlyModal("subgraph-modal");
      openSubgraph(target.rootId);
      if (target.selectedId) {
        window.requestAnimationFrame(() => {
          const node = nodesById.get(target.selectedId);
          subgraphState.selectedId = target.selectedId;
          renderSubgraphDetail(node);
          if (subgraphCy) {
            subgraphCy.nodes().unselect();
            const element = subgraphCy.getElementById(target.selectedId);
            if (element.length) element.select();
          }
        });
      }
      logEvent("info", "content_back_restored", { rootId: target.rootId, selectedId: target.selectedId || null });
      return true;
    }

    function closeModal() {
      contentState.returnSubgraph = null;
      closeAnyModal();
    }

    async function copyModalContent() {
      const text = document.getElementById("modal-code").textContent;
      const status = document.getElementById("copy-status");
      try {
        await navigator.clipboard.writeText(text);
        status.textContent = "Copied";
        logEvent("info", "content_copied", { length: text.length });
      } catch (error) {
        status.textContent = "Copy failed";
        logEvent("warning", "content_copy_failed", { error: String(error) });
      }
      window.setTimeout(() => {
        status.textContent = "";
      }, 1600);
    }

    cy.on("tap", "node", (event) => {
      activateNode(event.target.id());
    });

    cy.on("pan zoom", () => renderActionBadges(cy));

    document.getElementById("search").addEventListener("input", (event) => {
      state.search = event.target.value;
      applyHighlights();
    });

    document.getElementById("fit-button").addEventListener("click", () => {
      fitReadable(64);
    });
    document.getElementById("zoom-out-button").addEventListener("click", () => zoomGraph(cy, 0.9));
    document.getElementById("zoom-in-button").addEventListener("click", () => zoomGraph(cy, 1.1));

    document.getElementById("reset-button").addEventListener("click", () => {
      state.selectedId = null;
      state.search = "";
      document.getElementById("search").value = "";
      rebuildGraph();
    });

    document.getElementById("clear-focus-button").addEventListener("click", clearFocus);
    document.getElementById("back-content-button").addEventListener("click", restoreContentSource);
    document.getElementById("copy-content-button").addEventListener("click", copyModalContent);
    document.getElementById("formatted-content-button").addEventListener("click", () => setContentMode("formatted"));
    document.getElementById("plain-content-button").addEventListener("click", () => setContentMode("plain"));
    document.getElementById("fit-subgraph-button").addEventListener("click", () => {
      fitReadableGraph(subgraphCy, 64);
    });
    document.getElementById("zoom-out-subgraph-button").addEventListener("click", () => zoomGraph(subgraphCy, 0.9));
    document.getElementById("zoom-in-subgraph-button").addEventListener("click", () => zoomGraph(subgraphCy, 1.1));
    document.getElementById("content-modal").addEventListener("click", (event) => {
      if (event.target.id === "content-modal") closeModal();
    });
    document.getElementById("subgraph-modal").addEventListener("click", (event) => {
      if (event.target.id === "subgraph-modal") closeModal();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      if (document.getElementById("content-modal").classList.contains("visible")) {
        // dnsw change: Escape goes back one step (to the steps it came from), or closes
        if (restoreContentSource()) { event.preventDefault(); return; }
        event.preventDefault();
        closeModal();
        return;
      }
      if (document.getElementById("subgraph-modal").classList.contains("visible")) {
        event.preventDefault();
        closeModal();
      }
    });
    // dnsw change: the close crosses, and focus moves into a dialog when it opens and back to what opened it on close
    for (const id of ["content-close", "subgraph-close"]) {
      const button = document.getElementById(id);
      if (button) button.addEventListener("click", () => closeModal());
    }
    (function dialogFocus() {
      let opener = null;
      const modals = Array.from(document.querySelectorAll(".modal"));
      const anyOpen = () => modals.some((modal) => modal.classList.contains("visible"));
      const observer = new MutationObserver((records) => {
        for (const record of records) {
          const modal = record.target;
          const open = modal.classList.contains("visible");
          if (open && !modal.contains(document.activeElement)) {
            if (!opener || !document.body.contains(opener) || modals.some((m) => m.contains(opener))) {
              if (!modals.some((m) => m.contains(document.activeElement))) opener = document.activeElement;
            }
            const close = modal.querySelector(".modal-close");
            if (close) window.requestAnimationFrame(() => close.focus({ preventScroll: true }));
          }
        }
        if (!anyOpen() && opener) {
          const back = opener;
          opener = null;
          if (document.body.contains(back) && typeof back.focus === "function") back.focus({ preventScroll: true });
        }
      });
      for (const modal of modals) observer.observe(modal, { attributes: true, attributeFilter: ["class"] });
    })();
    // dnsw change: collapsible left column, remembered on this device
    (function railToggle() {
      const workspace = document.querySelector(".workspace");
      const button = document.getElementById("rail-toggle");
      if (!workspace || !button) return;
      const text = button.querySelector(".rail-toggle-text");
      const KEY = "flowchart-rail-collapsed";
      function set(collapsed, save) {
        const graph = document.getElementById("cy");
        const before = graph ? graph.clientWidth : 0;
        workspace.classList.toggle("rail-collapsed", collapsed);
        button.setAttribute("aria-expanded", String(!collapsed));
        const label = collapsed ? "Show panel" : "Hide panel";
        button.title = label;
        if (text) text.textContent = label;
        if (save) { try { localStorage.setItem(KEY, collapsed ? "1" : "0"); } catch (error) {} }
        window.requestAnimationFrame(() => {
          window.dispatchEvent(new Event("resize"));
          // keep the chart centred in the wider or narrower space, at the zoom the person chose
          const after = graph ? graph.clientWidth : 0;
          if (save && typeof cy !== "undefined" && cy && after !== before) cy.panBy({ x: (after - before) / 2, y: 0 });
        });
      }
      let stored = null;
      try { stored = localStorage.getItem(KEY); } catch (error) {}
      // on a narrow screen the panels stack, so the panel starts folded and the chart is near the top
      const narrow = window.matchMedia && window.matchMedia("(max-width: 880px)").matches;
      if (stored === "1" || (stored === null && narrow)) set(true, false);
      button.addEventListener("click", () => set(!workspace.classList.contains("rail-collapsed"), true));
    })();

    window.addEventListener("resize", () => {
      if (cy.elements().length) cy.resize();
      if (subgraphCy && subgraphCy.elements().length) subgraphCy.resize();
      renderActionBadges(cy);
      if (subgraphCy) renderActionBadges(subgraphCy);
    });

    function renderedRect(element) {
      const box = element.renderedBoundingBox({
        includeLabels: false,
        includeOverlays: false,
        includeUnderlays: false
      });
      return { x1: box.x1, y1: box.y1, x2: box.x2, y2: box.y2 };
    }

    function rectIntersectionArea(first, second) {
      const width = Math.min(first.x2, second.x2) - Math.max(first.x1, second.x1);
      const height = Math.min(first.y2, second.y2) - Math.max(first.y1, second.y1);
      return width > 0 && height > 0 ? width * height : 0;
    }

    function inflatedRect(rect, amount) {
      return {
        x1: rect.x1 - amount,
        y1: rect.y1 - amount,
        x2: rect.x2 + amount,
        y2: rect.y2 + amount
      };
    }

    function cornersOfRect(rect) {
      return [
        { x: rect.x1, y: rect.y1 },
        { x: rect.x2, y: rect.y1 },
        { x: rect.x2, y: rect.y2 },
        { x: rect.x1, y: rect.y2 }
      ];
    }

    function pointInsideDiamond(point, rect, tolerance = 0.92) {
      const centerX = (rect.x1 + rect.x2) / 2;
      const centerY = (rect.y1 + rect.y2) / 2;
      const halfWidth = Math.max(1, (rect.x2 - rect.x1) / 2);
      const halfHeight = Math.max(1, (rect.y2 - rect.y1) / 2);
      const value = Math.abs(point.x - centerX) / halfWidth + Math.abs(point.y - centerY) / halfHeight;
      return value <= tolerance;
    }

    function pointInsideRect(point, rect) {
      return point.x >= rect.x1 && point.x <= rect.x2 && point.y >= rect.y1 && point.y <= rect.y2;
    }

    function orientation(a, b, c) {
      const value = (b.y - a.y) * (c.x - b.x) - (b.x - a.x) * (c.y - b.y);
      if (Math.abs(value) < 0.001) return 0;
      return value > 0 ? 1 : 2;
    }

    function onSegment(a, b, c) {
      return b.x <= Math.max(a.x, c.x) && b.x >= Math.min(a.x, c.x)
        && b.y <= Math.max(a.y, c.y) && b.y >= Math.min(a.y, c.y);
    }

    function segmentsIntersect(a, b, c, d) {
      const o1 = orientation(a, b, c);
      const o2 = orientation(a, b, d);
      const o3 = orientation(c, d, a);
      const o4 = orientation(c, d, b);
      if (o1 !== o2 && o3 !== o4) return true;
      if (o1 === 0 && onSegment(a, c, b)) return true;
      if (o2 === 0 && onSegment(a, d, b)) return true;
      if (o3 === 0 && onSegment(c, a, d)) return true;
      if (o4 === 0 && onSegment(c, b, d)) return true;
      return false;
    }

    function segmentIntersectsRect(segment, rect) {
      if (pointInsideRect(segment.start, rect) || pointInsideRect(segment.end, rect)) return true;
      const corners = [
        { x: rect.x1, y: rect.y1 },
        { x: rect.x2, y: rect.y1 },
        { x: rect.x2, y: rect.y2 },
        { x: rect.x1, y: rect.y2 }
      ];
      return [
        [corners[0], corners[1]],
        [corners[1], corners[2]],
        [corners[2], corners[3]],
        [corners[3], corners[0]]
      ].some(([start, end]) => segmentsIntersect(segment.start, segment.end, start, end));
    }

    function approximateTaxiSegments(edge, boxesById) {
      return edgeRouteSegments(edge, boxesById);
    }

    function centerForRenderedNode(element, boxesById) {
      const box = boxesById.get(element.id());
      return { x: (box.x1 + box.x2) / 2, y: (box.y1 + box.y2) / 2 };
    }

    function auditParallelEdgeSpacing(edges, boxesById, context) {
      const issues = [];
      function sideForEndpoint(edge, endpoint) {
        const direction = edge.data("direction") || "right";
        if (direction === "down") return endpoint === "source" ? "bottom" : "top";
        if (direction === "up") return endpoint === "source" ? "top" : "bottom";
        if (direction === "left") return endpoint === "source" ? "left" : "right";
        return endpoint === "source" ? "right" : "left";
      }
      const groups = new Map();
      for (const edge of edges) {
        for (const endpoint of ["source", "target"]) {
          const nodeId = endpoint === "source" ? edge.source().id() : edge.target().id();
          const side = sideForEndpoint(edge, endpoint);
          const key = `${nodeId}:${side}`;
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push({
            edge,
            endpoint,
            side,
            offset: Number(edge.data(endpoint === "source" ? "sourceOffset" : "targetOffset")) || 0,
            width: Number(edge.data("width")) || EDGE_WIDTH_DEFAULT
          });
        }
      }
      function checkGroups() {
        for (const group of groups.values()) {
          if (group.length <= 1) continue;
          const offsets = group.sort((a, b) => a.offset - b.offset);
          for (let index = 1; index < offsets.length; index += 1) {
            const previous = offsets[index - 1];
            const current = offsets[index];
            const centerlineGap = Math.abs(current.offset - previous.offset);
            const requiredGap = Math.max(previous.width, current.width) + MIN_PARALLEL_EDGE_WHITESPACE;
            if (centerlineGap < requiredGap) {
              issues.push({
                severity: "error",
                type: "parallel-edge-spacing",
                message: `${context}: edges sharing the same node side do not leave visible whitespace`,
                edges: group.map((item) => item.edge.id()),
                side: previous.side,
                offsets: offsets.map((item) => item.offset),
                requiredGap
              });
              break;
            }
          }
        }
      }
      checkGroups();
      return issues;
    }

    function auditEdgeSegmentSpacing(edges, boxesById, context) {
      const issues = [];
      const tolerance = 0.75;
      const minimumOverlap = 8;
      const segments = [];
      edges.forEach((edge) => {
        edgeRouteSegments(edge, boxesById).forEach((segment) => {
          const width = Number(edge.data("width")) || EDGE_WIDTH_DEFAULT;
          const dx = Math.abs(segment.end.x - segment.start.x);
          const dy = Math.abs(segment.end.y - segment.start.y);
          const orientation = dx <= tolerance ? "vertical" : (dy <= tolerance ? "horizontal" : "");
          if (!orientation) return;
          segments.push({ edge, segment, width, orientation });
        });
      });

      function spanOverlap(firstStart, firstEnd, secondStart, secondEnd) {
        return Math.min(Math.max(firstStart, firstEnd), Math.max(secondStart, secondEnd))
          - Math.max(Math.min(firstStart, firstEnd), Math.min(secondStart, secondEnd));
      }

      for (let firstIndex = 0; firstIndex < segments.length; firstIndex += 1) {
        for (let secondIndex = firstIndex + 1; secondIndex < segments.length; secondIndex += 1) {
          const first = segments[firstIndex];
          const second = segments[secondIndex];
          if (first.edge.id() === second.edge.id()) continue;
          if (first.orientation !== second.orientation) continue;

          const requiredGap = Math.max(first.width, second.width) + MIN_PARALLEL_EDGE_WHITESPACE;
          let centerlineGap = Infinity;
          let overlap = 0;
          if (first.orientation === "vertical") {
            centerlineGap = Math.abs(first.segment.start.x - second.segment.start.x);
            overlap = spanOverlap(first.segment.start.y, first.segment.end.y, second.segment.start.y, second.segment.end.y);
          } else {
            centerlineGap = Math.abs(first.segment.start.y - second.segment.start.y);
            overlap = spanOverlap(first.segment.start.x, first.segment.end.x, second.segment.start.x, second.segment.end.x);
          }
          if (overlap > minimumOverlap && centerlineGap < requiredGap) {
            issues.push({
              severity: "error",
              type: "edge-segment-spacing",
              message: `${context}: parallel edge segments overlap or run too close together`,
              edges: [first.edge.id(), second.edge.id()],
              orientation: first.orientation,
              centerlineGap,
              requiredGap,
              overlap
            });
          }
        }
      }
      return issues;
    }

    function auditCytoscapeGraph(instance, context) {
      const issues = [];
      if (!instance) return { context, nodes: 0, edges: 0, zoom: null, issues };

      const nodes = instance.nodes().toArray();
      const edges = instance.edges().toArray();
      const boxesById = new Map(nodes.map((node) => [node.id(), renderedRect(node)]));
      const containerBox = instance.container().getBoundingClientRect();

      for (let i = 0; i < nodes.length; i += 1) {
        const type = nodes[i].data("type") || "process";
        const expectedSize = {
          ...NODE_SIZE_DEFAULT,
          ...(NODE_SIZE_BY_TYPE[type] || {}),
          ...(typeMeta(type).size || {})
        };
        const actualWidth = Number(nodes[i].data("width"));
        const actualHeight = Number(nodes[i].data("height"));
        const actualTextWidth = Number(nodes[i].data("textWidth"));
        if (
          Math.abs(actualWidth - expectedSize.width) > 0.5
          || Math.abs(actualHeight - expectedSize.height) > 0.5
          || Math.abs(actualTextWidth - expectedSize.textWidth) > 0.5
        ) {
          issues.push({
            severity: "error",
            type: "node-size-nonstandard",
            message: `${context}: ${nodes[i].id()} does not use the standard size for ${type}`,
            node: nodes[i].id(),
            width: actualWidth,
            height: actualHeight,
            textWidth: actualTextWidth
          });
        }
        const longWords = String(nodes[i].data("label") || "")
          .split(/\s+/)
          .filter((word) => word.length > expectedSize.maxChars);
        if (longWords.length) {
          issues.push({
            severity: "error",
            type: "label-word-too-long",
            message: `${context}: ${nodes[i].id()} has label words that cannot fit without breaking`,
            node: nodes[i].id(),
            words: longWords
          });
        }
        for (let j = i + 1; j < nodes.length; j += 1) {
          const first = boxesById.get(nodes[i].id());
          const second = boxesById.get(nodes[j].id());
          const area = rectIntersectionArea(first, second);
          if (area > 1) {
            issues.push({
              severity: "error",
              type: "node-overlap",
              message: `${context}: ${nodes[i].id()} overlaps ${nodes[j].id()}`,
              nodes: [nodes[i].id(), nodes[j].id()],
              area: Math.round(area)
            });
          }
        }
        const nodeBox = boxesById.get(nodes[i].id());
        const labelBox = nodes[i].renderedBoundingBox({
          includeLabels: true,
          includeOverlays: false,
          includeUnderlays: false
        });
        if (
          labelBox.x1 < nodeBox.x1 - 4
          || labelBox.y1 < nodeBox.y1 - 4
          || labelBox.x2 > nodeBox.x2 + 4
          || labelBox.y2 > nodeBox.y2 + 4
        ) {
          issues.push({
            severity: "error",
            type: "label-overflow",
            message: `${context}: ${nodes[i].id()} label is outside its node shape`,
            node: nodes[i].id(),
            labelBox: {
              x1: Math.round(labelBox.x1),
              y1: Math.round(labelBox.y1),
              x2: Math.round(labelBox.x2),
              y2: Math.round(labelBox.y2)
            },
            nodeBox: {
              x1: Math.round(nodeBox.x1),
              y1: Math.round(nodeBox.y1),
              x2: Math.round(nodeBox.x2),
              y2: Math.round(nodeBox.y2)
            }
          });
        }
        const fillColor = nodes[i].style("background-color");
        const textColor = nodes[i].style("color");
        const contrast = chroma.contrast(fillColor, textColor);
        if (contrast < 4.5) {
          issues.push({
            severity: "error",
            type: "node-label-low-contrast",
            message: `${context}: ${nodes[i].id()} label contrast is below 4.5:1`,
            node: nodes[i].id(),
            contrast: Number(contrast.toFixed(2)),
            fillColor,
            textColor
          });
        }
        const outlineWidth = parseFloat(nodes[i].style("text-outline-width")) || 0;
        if (outlineWidth > 0.05) {
          issues.push({
            severity: "error",
            type: "node-label-outline",
            message: `${context}: ${nodes[i].id()} uses text outline instead of direct contrast`,
            node: nodes[i].id(),
            outlineWidth
          });
        }
        if (nodes[i].style("shape") === "diamond") {
          const labelCorners = cornersOfRect(labelBox);
          if (labelCorners.some((point) => !pointInsideDiamond(point, nodeBox, 0.9))) {
            issues.push({
              severity: "error",
              type: "diamond-label-overflow",
              message: `${context}: ${nodes[i].id()} label is outside the diamond interior`,
              node: nodes[i].id()
            });
          }
        }
